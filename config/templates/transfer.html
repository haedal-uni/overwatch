<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기록 옮기기</title>
  <style>
    :root { --bg: #eef5ff; --card: #fff; --text: #16233b; --muted: #61708a; --line: #d6e2f5; --accent: #2f6df6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #081120; --card: #121f36; --text: #eaf1ff; --muted: #94a3bd; --line: #24344f; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { font-size: 22px; margin: 10px 0 6px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 4px 0 10px; }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
    h2 { font-size: 16px; margin: 0 0 6px; }
    textarea { width: 100%; height: 110px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text); padding: 10px; font: 12px monospace; resize: vertical; }
    button { height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin: 8px 8px 0 0; }
    button.gray { background: var(--line); color: var(--text); }
    .msg { font-size: 14px; font-weight: 700; margin-top: 8px; min-height: 20px; }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 처음 화면</a>
  <h1>기록 옮기기</h1>

  <section class="box">
    <h2>1. 이 브라우저의 기록 내보내기</h2>
    <p>옮기고 싶은 쪽(옛 주소·다른 브라우저)에서 눌러 주세요.</p>
    <button id="make">코드 만들기</button>
    <textarea id="out" readonly placeholder="코드가 여기에 나와요"></textarea>
    <button id="copy" class="gray">복사</button><button id="save" class="gray">파일로 저장</button>
    <div class="msg" id="out-msg"></div>
  </section>

  <section class="box">
    <h2>2. 이 브라우저로 가져오기</h2>
    <p>같은 이름의 기록은 가져온 것으로 <b>덮어써요.</b> 이미 쌓인 기록이 있으면 먼저 1번으로 내보내 두세요.</p>
    <textarea id="in" placeholder="코드를 붙여 넣으세요"></textarea>
    <input type="file" id="file" accept=".txt,.json" hidden>
    <button id="load">가져오기</button><button id="pick" class="gray">파일에서 불러오기</button>
    <div class="msg" id="in-msg"></div>
  </section>
</div>
<script>
  // 이 서비스가 쓰는 localStorage 이름 앞부분만 옮긴다(앱 코드는 서로 참조하지 않는다).
  var PREFIXES = ["owcoach.", "game.", "ow."];
  var TAG = "OWTRANSFER1:";
  var $ = function (id) { return document.getElementById(id); };
  function mine(k) { return PREFIXES.some(function (p) { return k.indexOf(p) === 0; }); }
  function enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function dec(s) { return decodeURIComponent(escape(atob(s))); }

  $("make").onclick = function () {
    var data = {};
    try {
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (mine(k)) data[k] = localStorage.getItem(k); }
    } catch (e) { $("out-msg").textContent = "이 브라우저에서는 저장된 기록을 읽을 수 없어요."; return; }
    var n = Object.keys(data).length;
    if (!n) { $("out").value = ""; $("out-msg").textContent = "옮길 기록이 없어요. 기록을 쌓은 주소·브라우저에서 열었는지 확인해 주세요."; return; }
    $("out").value = TAG + enc(JSON.stringify(data));
    $("out-msg").textContent = "기록 " + n + "개를 코드로 만들었어요.";
  };
  $("copy").onclick = function () {
    var t = $("out").value;
    if (!t) { $("out-msg").textContent = "먼저 코드를 만들어 주세요."; return; }
    var done = function () { $("out-msg").textContent = "복사했어요."; };
    var fail = function () { $("out-msg").textContent = "복사하지 못했어요. 위 칸을 길게 눌러 전체 선택 후 복사하거나 '파일로 저장'을 써 주세요."; };
    // 아이폰은 읽기 전용 칸의 select()가 안 먹어서, 잠깐 읽기 전용을 풀고 범위를 직접 잡는다.
    var legacy = function () {
      var el = $("out");
      var ok = false;
      el.readOnly = false;
      el.focus();
      el.setSelectionRange(0, el.value.length);
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      el.readOnly = true;
      el.blur();
      if (ok) done(); else fail();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, legacy);
    else legacy();
  };
  $("save").onclick = function () {
    var t = $("out").value;
    if (!t) { $("out-msg").textContent = "먼저 코드를 만들어 주세요."; return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" }));
    a.download = "ow-records.txt";
    a.click();
  };
  $("pick").onclick = function () { $("file").click(); };
  $("file").onchange = function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { $("in").value = String(r.result).trim(); };
    r.readAsText(f);
  };
  $("load").onclick = function () {
    // 붙여 넣을 때 줄바꿈·공백이 끼거나 앞뒤에 다른 글자가 붙어도 코드 부분만 쓴다.
    var t = $("in").value.replace(/\s+/g, "");
    var at = t.indexOf(TAG);
    if (at < 0) { $("in-msg").textContent = "코드가 올바르지 않아요. 'OWTRANSFER1:'로 시작하는 코드를 끝까지 복사했는지 확인해 주세요."; return; }
    t = t.slice(at);
    var data;
    try { data = JSON.parse(dec(t.slice(TAG.length))); } catch (e) { $("in-msg").textContent = "코드를 읽을 수 없어요. 끝까지 복사했는지 확인해 주세요."; return; }
    var n = 0;
    try {
      Object.keys(data).forEach(function (k) { if (mine(k) && typeof data[k] === "string") { localStorage.setItem(k, data[k]); n++; } });
    } catch (e) { $("in-msg").textContent = "저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요."; return; }
    $("in-msg").textContent = "기록 " + n + "개를 가져왔어요. 챗봇·게임을 새로고침하면 보여요.";
  };
</script>
</body>
</html>
