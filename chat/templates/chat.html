{% load static %}
<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <script src="/pwa/inset.js"></script>
  <title>오버워치 코치 AI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/pwa/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OW 코치">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef5ff;
      --bg2: #f8fbff;
      --card: rgba(255, 255, 255, .86);
      --card-solid: #ffffff;
      --line: #dbe7fb;
      --line-strong: #bcd1f5;
      --text: #132033;
      --muted: #6b7a92;
      --soft: #f3f7ff;
      --primary: #2563eb;
      --primary2: #4f8cff;
      --primary-soft: #eaf1ff;
      --accent: #ff9f1c;
      --danger: #ef4444;
      --success: #16a34a;
      --shadow: 0 22px 60px rgba(33, 74, 132, .14);
      --radius: 28px;
      --tint-orange-bg: #fff3e2;
      --tint-orange: #c2410c;
      --tint-green-bg: #e7f6ec;
      --tint-green: #15803d;
    }

    html[data-theme="dark"] {
      --bg: #081120;
      --bg2: #0e1a2f;
      --card: rgba(15, 28, 49, .84);
      --card-solid: #101d33;
      --line: #203756;
      --line-strong: #315783;
      --text: #eef6ff;
      --muted: #a9b8cc;
      --soft: #13233a;
      --primary: #5aa2ff;
      --primary2: #79b7ff;
      --primary-soft: #102a4f;
      --accent: #ffb84d;
      --danger: #ff6b6b;
      --success: #5ee087;
      --shadow: 0 22px 60px rgba(0, 0, 0, .35);
      --tint-orange-bg: rgba(255, 159, 28, .14);
      --tint-orange: #ffb84d;
      --tint-green-bg: rgba(94, 224, 135, .13);
      --tint-green: #5ee087;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 8%, rgba(37, 99, 235, .16), transparent 32%),
        radial-gradient(circle at 84% 12%, rgba(255, 159, 28, .15), transparent 34%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      height: 100vh;
      padding: 22px;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 18px;
    }

    .panel,
    .chat-shell {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .panel {
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 4px 18px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-size: 23px;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .25);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .side-section {
      padding: 18px 0;
      border-bottom: 1px solid var(--line)
    }

    .side-section:last-child {
      border-bottom: 0
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .08em;
      margin-bottom: 10px
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .role-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      transition: .16s;
    }

    .role-btn:hover,
    .role-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      min-height: 0;
      max-height: 260px;
      padding-right: 3px
    }

    .quick-btn {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 16px;
      padding: 11px 12px;
      line-height: 1.45;
      font-size: 13px;
      transition: .16s;
    }

    .quick-btn:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(37, 99, 235, .12)
    }

    .quick-tag {
      display: block;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px
    }

    .status-card {
      margin-top: auto;
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-soft), transparent);
      border: 1px solid var(--line);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px
    }

    .status-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px
    }

    .recent-item {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: .16s;
    }

    .recent-item:hover {
      border-color: var(--primary)
    }

    .recent-empty {
      font-size: 12px;
      color: var(--muted)
    }

    .status-value {
      font-weight: 800;
      color: var(--text)
    }

    .title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .site-back { display: inline-flex; align-items: center; justify-content: center; flex: none; text-decoration: none; color: inherit; }

    .chat-shell {
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .chat-shell>* {
      flex: none
    }

    .chat-shell>.messages {
      flex: 1;
      min-height: 0
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, .3), transparent);
    }

    html[data-theme="dark"] .topbar {
      background: linear-gradient(180deg, rgba(255, 255, 255, .03), transparent)
    }

    .title-wrap h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.04em
    }

    .title-wrap p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .help-hint {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 60;
      width: max-content;
      max-width: 240px;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 700;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .help-hint.show {
      opacity: 1;
      transform: translateY(0);
    }

    .help-hint::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 14px;
      width: 12px;
      height: 12px;
      background: var(--card-solid);
      border-left: 1px solid var(--line-strong);
      border-top: 1px solid var(--line-strong);
      transform: rotate(45deg);
    }

    /* 첫 화면에서는 상성표·내 기록·영웅으로 묻기가 본문 카드로 나와서 위·아래 버튼을 숨긴다(죽었어요는 맵 선택 옆이라 남는다). */
    .chat-shell:has(#welcome) .chat-only,
    .chat-shell:has(#welcome) .hero-ask-row {
      display: none
    }

    #matchupBtn {
      border-color: transparent;
      background: var(--tint-orange-bg);
      color: var(--tint-orange)
    }

    #recordsBtn {
      border-color: transparent;
      background: var(--tint-green-bg);
      color: var(--tint-green)
    }

    /* 더보기(⋯) 메뉴: 야간 모드, 대화 저장, 사용법 */
    .more-wrap {
      position: relative
    }

    .more-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 70;
      width: 220px;
      padding: 6px;
      border-radius: 18px;
      background: var(--card-solid);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .more-menu[hidden] {
      display: none
    }

    .more-item {
      height: 46px;
      padding: 0 10px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .more-item:hover {
      background: var(--soft)
    }

    .more-item svg {
      flex: none;
      color: var(--muted)
    }

    .more-item>span:first-of-type {
      flex: 1
    }

    .more-switch {
      width: 38px;
      height: 22px;
      padding: 3px;
      border-radius: 99px;
      background: var(--line-strong);
      display: flex;
      transition: .16s;
    }

    .more-switch::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 99px;
      background: #fff;
      transition: .16s;
    }

    .more-item[aria-checked="true"] .more-switch {
      background: var(--primary)
    }

    .more-item[aria-checked="true"] .more-switch::after {
      transform: translateX(16px)
    }

    /* ── 사용법 투어 ──
       단계 전환에 transition을 쓰지 않는다(깜박임 방지). */
    .tour-dim {
      position: fixed;
      background: rgba(4, 10, 22, .62);
      z-index: 200;
    }

    .tour-highlight {
      position: fixed;
      z-index: 201;
      border-radius: 16px;
      box-shadow: 0 0 0 3px var(--primary), 0 0 32px rgba(37, 99, 235, .55);
      pointer-events: none;
    }

    .tour-tooltip {
      position: fixed;
      z-index: 202;
      max-width: 300px;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      /* positionTour()가 max-height를 넣었을 때 내용이 스크롤되도록. */
      overflow-y: auto;
    }

    .tour-tooltip-step {
      font-size: 12px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: .04em;
      margin-bottom: 6px;
    }

    .tour-tooltip-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -.02em;
    }

    .tour-tooltip-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .tour-tooltip-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .tour-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      transition: .15s;
    }

    .tour-btn:hover:not(:disabled):not(.primary) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .tour-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .tour-btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
    }

    .tour-btn.primary:hover {
      color: #fff;
      opacity: .92;
    }

    /* ── 대화 저장 모달 ── */
    .save-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 22, .55);
      z-index: 300;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .save-modal {
      width: 100%;
      max-width: 460px;
      max-height: 85vh;
      overflow: auto;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .save-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .save-modal-header h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .save-modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }

    .save-modal-close:hover {
      color: var(--text);
    }

    .save-modal-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .save-modal-save-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
      border-radius: 14px;
      padding: 12px;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 18px;
      transition: .15s;
    }

    .save-modal-save-btn:hover:not(:disabled) {
      opacity: .92;
    }

    .save-modal-save-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .save-modal-limit-note {
      font-size: 12.5px;
      color: var(--accent);
      margin: -10px 0 16px;
    }

    .save-chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .save-chat-empty {
      font-size: 13px;
      color: var(--muted);
      padding: 18px 0;
      text-align: center;
    }

    .save-chat-card {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .save-chat-card-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save-chat-card-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .save-chat-card-actions {
      display: flex;
      gap: 8px;
    }

    .save-chat-card-actions button {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 0;
      font-size: 12.5px;
      font-weight: 700;
      transition: .15s;
    }

    .save-chat-card-actions .save-chat-load:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .save-chat-card-actions .save-chat-delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .icon-btn,
    .plain-btn {
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      height: 42px;
      border-radius: 14px;
      padding: 0 14px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      transition: .16s;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px
    }

    .icon-btn:hover,
    .plain-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft)
    }

    /* 입력창 위 한 줄: 맵 선택 · 공격/수비 · 간단히/자세히 */
    .composer-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .custom-select {
      position: relative;
      min-width: 0
    }

    /* 좁은 화면에서는 맵 이름이 줄어들고(…) 공격/수비·간단히/자세히는 그대로 둔다. */
    .composer-tools .custom-select {
      flex: 0 1 auto;
      max-width: 220px
    }

    .composer-tools>*:not(.custom-select) {
      flex: none
    }

    .select-trigger {
      max-width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      border-radius: 999px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      transition: .16s;
    }

    .select-trigger svg {
      flex: none
    }

    .select-trigger span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .select-trigger.has-map {
      border-color: var(--line-strong);
      background: var(--primary-soft);
      color: var(--primary)
    }

    .select-trigger:hover,
    .custom-select.open .select-trigger {
      border-color: var(--primary);
      color: var(--primary)
    }

    /* 입력창 바로 위에 있어서 위로 펼친다. */
    .select-menu {
      position: absolute;
      left: 0;
      width: min(340px, calc(100vw - 24px));
      bottom: calc(100% + 8px);
      z-index: 50;
      background: var(--card-solid);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      box-shadow: 0 24px 56px rgba(24, 54, 97, .22);
      overflow: hidden;
      display: none;
    }

    .custom-select.open .select-menu {
      display: block;
      animation: pop .14s ease-out
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(-5px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .select-search {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft)
    }

    .select-search input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card-solid);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .select-list {
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      transform: translateZ(0);
      padding: 10px;
      scrollbar-width: thin;
    }

    .select-group {
      margin: 10px 4px 6px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -.02em;
      background: var(--primary-soft);
      border: 1px solid rgba(37, 99, 235, .18);
      border-radius: 12px;
    }

    .select-option {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      transition: .12s;
    }

    .select-option:hover,
    .select-option.active {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .select-empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px
    }

    .side-toggle {
      display: none;
      gap: 6px;
      align-items: center;
      white-space: nowrap
    }

    .side-toggle.show {
      display: flex
    }

    .side-btn {
      height: 36px;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--muted);
      border-radius: 999px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .side-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    /* 맵 이름은 맵 선택 버튼에 보이므로 여기서는 지우기(×) 버튼만 보여준다. */
    .context-pill {
      display: none
    }

    .context-pill.show {
      display: flex
    }

    .context-pill #contextText {
      display: none
    }

    .context-pill button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      font-size: 18px
    }

    .messages {
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 첫 화면: 할 수 있는 일(영웅으로 묻기 · 스탯창 · 상성표 · 내 기록)과 예시 질문 */
    .welcome {
      margin: auto;
      width: 100%;
      max-width: 560px;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .welcome h2 {
      font-size: 26px;
      letter-spacing: -.04em;
    }

    .welcome p {
      margin-top: -8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .wl-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 0;
      border-radius: 22px;
      background: var(--primary);
      color: #fff;
      text-align: left;
      box-shadow: 0 12px 28px rgba(37, 99, 235, .28);
      transition: .16s;
    }

    .wl-hero:hover {
      transform: translateY(-1px)
    }

    .wl-faces {
      display: flex;
      flex: none
    }

    .wl-faces img {
      width: 40px;
      height: 40px;
      border-radius: 99px;
      border: 2px solid #fff;
      object-fit: cover;
      background: var(--primary-soft)
    }

    .wl-faces img+img {
      margin-left: -14px
    }

    .wl-hero-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0
    }

    .wl-hero-text b {
      font-size: 17px;
      font-weight: 800
    }

    .wl-hero-text span {
      font-size: 13px;
      opacity: .88
    }

    .wl-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .wl-card {
      min-width: 0;
      padding: 12px 2px 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card-solid);
      color: var(--text);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: .16s;
    }

    .wl-card:hover {
      border-color: var(--primary)
    }

    .wl-card b {
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.3;
      word-break: keep-all
    }

    .wl-ico {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      margin-bottom: 2px;
    }

    .wl-ico.blue {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .wl-ico.orange {
      background: var(--tint-orange-bg);
      color: var(--tint-orange)
    }

    .wl-ico.green {
      background: var(--tint-green-bg);
      color: var(--tint-green)
    }

    .wl-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px
    }

    .sample-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sample-chips .chip {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sample-chips .chip[hidden] {
      display: none
    }

    .sample-chips .chip:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--text)
    }

    .wl-more {
      align-self: flex-start;
      margin-top: 4px;
      padding: 6px 0;
      border: 0;
      background: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .chip {
      border: 1px solid var(--line-strong);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 13px;
    }

    .chip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fade .18s ease-out
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .msg.user {
      justify-content: flex-end
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      flex: 0 0 auto
    }

    .msg.user .avatar {
      order: 2;
      background: var(--primary);
      color: white;
      border-color: var(--primary)
    }

    .bubble-wrap {
      max-width: min(780px, 78%)
    }

    .msg.user .bubble-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 5px 2px
    }

    .msg.user .meta {
      margin-right: 2px
    }

    .bubble {
      border: 1px solid var(--line);
      background: var(--card-solid);
      border-radius: 20px;
      padding: 10px 13px;
      line-height: 1.58;
      font-size: 14.5px;
      white-space: normal;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border-color: transparent;
      color: white;
      border-bottom-right-radius: 7px
    }

    .msg.ai .bubble {
      border-bottom-left-radius: 7px
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      font-size: 17px;
      margin: 12px 0 6px;
      color: var(--primary)
    }

    .bubble p {
      margin: 2px 0
    }

    .bubble ul,
    .bubble ol {
      padding-left: 18px;
      margin: 6px 0
    }

    .bubble strong {
      color: var(--primary)
    }

    .bubble .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13px;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    .bubble .md-table th,
    .bubble .md-table td {
      border: 1px solid var(--line);
      padding: 5px 8px;
      text-align: left;
    }

    .bubble .md-table th {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      white-space: nowrap;
    }

    .msg.user .bubble strong {
      color: white
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, .42);
      background: rgba(255, 255, 255, .16);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line)
    }

    .suggest-btn {
      border: 1px solid var(--line-strong);
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 800
    }

    .suggest-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary)
    }

    /* 지난 답변에 붙어 있던 버튼(이미 새 메시지가 온 뒤) */
    .suggest-btn:disabled,
    .suggest-btn-used {
      opacity: .45;
      cursor: default;
    }

    .suggest-btn:disabled:hover,
    .suggest-btn-used:hover {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--line-strong);
    }

    .feedback-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line)
    }

    .feedback-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .feedback-toggle:hover {
      color: var(--danger)
    }

    .feedback-form {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feedback-form textarea {
      width: 100%;
      min-height: 60px;
      border: 1.5px solid var(--line-strong);
      border-radius: 14px;
      background: var(--card-solid);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      resize: vertical;
    }

    .feedback-form textarea:focus {
      border-color: var(--primary)
    }

    .feedback-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end
    }

    .feedback-submit,
    .feedback-cancel {
      border-radius: 12px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 800;
    }

    .feedback-submit {
      border: 0;
      background: var(--danger);
      color: white;
    }

    .feedback-submit:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .feedback-cancel {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }

    .feedback-done {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .matchup-card {
      margin-top: 10px;
      border: 1px solid var(--line);
      background: var(--card-solid);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .matchup-card-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
    }

    .matchup-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .matchup-col-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .matchup-col-hard .matchup-col-title {
      color: var(--danger)
    }

    .matchup-col-easy .matchup-col-title {
      color: var(--success)
    }

    .matchup-col-recommend .matchup-col-title {
      color: var(--primary)
    }

    .matchup-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13.5px;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .matchup-col-hard .matchup-item {
      border-color: rgba(239, 68, 68, .28)
    }

    .matchup-col-easy .matchup-item {
      border-color: rgba(22, 163, 74, .28)
    }

    .matchup-col-recommend .matchup-item {
      border-color: rgba(37, 99, 235, .28)
    }

    .matchup-hero-icon {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .matchup-hero {
      font-weight: 800;
      color: var(--text);
    }

    .matchup-note {
      color: var(--muted);
      font-size: 12.5px;
    }

    .matchup-note::before {
      content: "· ";
    }

    .matchup-caution {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12.5px;
    }

    /* ── 전체 상성표 모달 ── */
    .mx-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--line-strong);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: .16s;
    }

    .mx-open-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .mx-open-btn svg {
      flex: 0 0 auto;
    }

    /* 역할 탭마다 영웅 수가 달라 높이를 고정하고 안쪽만 스크롤한다. */
    .mx-modal {
      width: 100%;
      max-width: 720px;
      height: min(560px, 86vh);
      display: flex;
      flex-direction: column;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .mx-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--primary-soft), transparent);
    }

    .mx-head-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mx-head h3 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mx-head-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    .mx-body {
      padding: 16px 20px 20px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .mx-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .mx-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 11px;
      transition: .14s;
    }

    .mx-tab:hover {
      color: var(--text);
    }

    .mx-tab.active {
      background: var(--card-solid);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(33, 74, 132, .12);
    }

    .mx-hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 9px;
    }

    .mx-hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 11px 6px 9px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--soft);
      transition: .14s;
    }

    .mx-hero-card:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-2px);
    }

    .mx-hero-card:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .mx-hero-card img {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--card-solid);
    }

    .mx-hero-card span {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
    }

    .mx-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 11px;
      margin-bottom: 14px;
      transition: .14s;
    }

    .mx-back:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .mx-detail-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid var(--line);
      margin-bottom: 16px;
    }

    .mx-detail-head img {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--line-strong);
      flex: 0 0 auto;
    }

    .mx-detail-name {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .mx-role-chip {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 2px 9px;
    }

    .mx-detail-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .mx-group {
      margin-bottom: 18px;
    }

    .mx-group:last-child {
      margin-bottom: 0;
    }

    .mx-group-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .mx-group-title::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }

    .mx-group-hard .mx-group-title {
      color: var(--danger)
    }

    .mx-group-easy .mx-group-title {
      color: var(--success)
    }

    .mx-group-mixed .mx-group-title {
      color: var(--accent)
    }

    .mx-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .mx-role-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .04em;
      margin: 3px 0 1px;
    }

    .mx-role-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .mx-list > .mx-role-line:first-child {
      margin-top: 0;
    }

    .mx-foe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 7px;
    }

    .mx-foe {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 9px 4px 8px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      transition: .14s;
    }

    .mx-foe:hover {
      transform: translateY(-2px);
      background: var(--primary-soft);
    }

    .mx-group-hard .mx-foe {
      border-color: rgba(239, 68, 68, .26)
    }

    .mx-group-easy .mx-foe {
      border-color: rgba(22, 163, 74, .26)
    }

    .mx-group-mixed .mx-foe {
      border-color: rgba(255, 159, 28, .3)
    }

    .mx-foe img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--card-solid);
    }

    .mx-foe-name {
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
    }

    .mx-foe .mx-verdict {
      font-size: 10.5px;
      padding: 1px 7px;
    }

    .mx-foe-detail {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mx-vs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 14px;
      border-radius: 18px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .mx-vs-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .mx-vs-hero img {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      object-fit: cover;
      border: 1px solid var(--line-strong);
    }

    .mx-vs-mark {
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .mx-foe-verdict {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    .mx-foe-verdict .mx-verdict {
      font-size: 12.5px;
      padding: 3px 11px;
    }

    .mx-foe-note {
      font-size: 13.5px;
      line-height: 1.65;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      word-break: keep-all;
    }

    .mx-ask-wide {
      width: 100%;
      padding: 11px 14px;
      font-size: 13.5px;
    }

    .mx-verdict {
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid transparent;
    }

    .mx-group-hard .mx-verdict {
      color: var(--danger);
      background: rgba(239, 68, 68, .12);
      border-color: rgba(239, 68, 68, .3);
    }

    /* 결과 카드 · 내 기록(my_records.js) */

      /* 화면에 고정해 실제 보이는 영역에 맞춘다(100dvh는 설치 앱에서 아래가 막대 뒤로 가려졌다). 아래는 --sab만큼 비운다. */

        padding: 0;
        gap: 0
      }

      .chat-shell {
        border-radius: 0;
        border: 0;
        box-shadow: none
      }

      .topbar {
        min-height: 62px;
        padding: 12px 14px
      }

      .title-wrap h1 {
        font-size: 17px
      }

      .title-wrap p {
        display: none
      }

      .plain-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 11px;
        border-radius: 13px;
        font-size: 12px
      }

      .actions {
        gap: 6px
      }

      .icon-btn {
        height: 38px;
        width: 38px;
        border-radius: 13px
      }

      .mx-open-btn {
        height: 38px;
        padding: 0 10px;
        border-radius: 13px;
        font-size: 12px;
        gap: 4px;
      }

      .mx-modal {
        height: min(720px, 88vh);
        border-radius: 20px;
      }

      .mx-body {
        padding: 14px 14px 18px;
      }

      .mx-head {
        padding: 14px 14px 12px;
      }

      .mx-hero-grid {
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 7px;
      }

      .mx-foe-grid {
        grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
        gap: 6px;
      }

      .gd-tabs {
        margin: 6px -14px 14px;
        padding: 0 14px;
        top: -14px;
      }

      .gd-cta {
        bottom: -18px;
        margin: 14px -14px -18px;
        padding: 12px 14px 16px;
      }

      /* 모바일에서는 역할 선택 / 추천 질문 영역을 숨김 */
      .mobile-quick {
        display: none !important
      }

      .select-menu {
        border-radius: 18px
      }

      .select-list {
        max-height: 220px;
        padding: 8px
      }

      .select-group {
        font-size: 14px;
        padding: 7px 10px;
        margin: 8px 3px 5px
      }

      .select-option {
        font-size: 15px;
        padding: 10px 12px
      }

      .side-btn {
        padding: 0 10px
      }

      .messages {
        padding: 16px 14px
      }

      .bubble-wrap {
        max-width: 88%
      }

      .bubble {
        font-size: 13px;
        padding: 8px 10px;
        line-height: 1.55
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 13px
      }

      .welcome {
        margin: 0 auto auto;
        padding: 4px 0
      }

      .welcome h2 {
        font-size: 23px
      }

      .welcome p {
        font-size: 13.5px
      }

      .composer {
        padding: 11px 12px 12px
      }

      .style-btn {
        padding: 0 11px
      }

      .input-box {
        border-radius: 20px;
        padding: 8px;
        gap: 8px
      }

      textarea {
        min-height: 38px;
        font-size: 13px;
        padding: 8px 5px
      }

      .send-btn {
        height: 38px;
        border-radius: 14px;
        padding: 0 13px;
        font-size: 13px
      }

      .upload-btn {
        height: 38px;
        width: 38px;
        border-radius: 14px;
        font-size: 16px
      }
    }

    @media(max-width:420px) {
      .composer-tools {
        gap: 4px
      }

      .side-btn,
      .style-btn {
        padding: 0 9px
      }

      /* 좁은 휴대폰: 제목이 한 글자씩 꺾이지 않게 버튼을 조금 줄인다 */
      .topbar {
        padding: 10px;
        gap: 8px
      }

      .title-wrap h1 {
        font-size: 15px;
        word-break: keep-all
      }

      .actions {
        gap: 4px
      }

      .icon-btn {
        width: 34px;
        height: 34px
      }

      .plain-btn,
      .mx-open-btn {
        height: 34px;
        padding: 0 8px
      }

      .mx-open-btn {
        gap: 3px
      }

      .bubble-wrap {
        max-width: 92%
      }

      .bubble {
        padding: 7px 10px;
        font-size: 12.8px
      }

      .select-list {
        max-height: 210px
      }
    }

    @media(max-width:380px) {
      /* 아주 좁은 화면: 영웅 가이드는 아이콘만(버튼 title에 이름이 남는다) */
      .mx-open-label {
        display: none
      }

      .icon-btn {
        width: 32px;
        height: 32px
      }
    }

    /* AI 답변 말풍선 가독성 개선 */
    .msg.ai .bubble {
      white-space: normal;
      line-height: 1.75;
      font-size: 15px;
    }

    /* AI 답변 문단 간격 */
    .msg.ai .bubble p {
      margin: 0 0 12px;
    }

    /* AI 답변 제목 간격 */
    .msg.ai .bubble h1,
    .msg.ai .bubble h2,
    .msg.ai .bubble h3 {
      margin: 16px 0 8px;
      line-height: 1.45;
    }

    /* AI 답변 목록 간격(문단 간격보다 좁게). */
    .msg.ai .bubble ul,
    .msg.ai .bubble ol {
      margin: 4px 0 14px;
      padding-left: 22px;
    }

    /* 중첩 목록은 부모 항목에 붙어 한 묶음으로 읽혀야 해서 아래 여백을 두지 않는다. */
    .msg.ai .bubble li>ul,
    .msg.ai .bubble li>ol {
      margin: 2px 0 0;
    }

    /* AI 답변 목록 항목 간격(line-height도 문단보다 좁게). */
    .msg.ai .bubble li {
      margin: 2px 0;
      line-height: 1.4;
    }

    /* AI 답변 줄바꿈 간격 */
    .msg.ai .bubble br {
      display: block;
      content: "";
      margin-top: 6px;
    }

    /* 한국어 단어가 줄 끝에서 둘로 쪼개지지 않게 단어 단위로 줄을 바꾼다(표는 예전대로). */
    .msg .bubble {
      word-break: keep-all;
      overflow-wrap: break-word
    }

    .msg .bubble table {
      word-break: normal
    }

    /* 폰에서는 질문과 답변 앞부분이 한 화면에 함께 보이도록 답변 글자와 간격을 줄인다. */
    @media(max-width:720px) {
      .msg.ai .bubble {
        font-size: 14px;
        line-height: 1.6
      }

      .msg.ai .bubble p {
        margin-bottom: 8px
      }

      .msg.ai .bubble h1,
      .msg.ai .bubble h2,
      .msg.ai .bubble h3 {
        margin: 12px 0 6px
      }

      .msg.ai .bubble ul,
      .msg.ai .bubble ol {
        margin: 2px 0 10px;
        padding-left: 20px
      }

      .msg.ai .bubble br {
        margin-top: 4px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="7" />
            <line x1="12" y1="1" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="1" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="23" y2="12" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <div>
          <div class="brand-title">오버워치 코치 AI</div>
          <div class="brand-sub">상황 기반 전술 상담</div>
        </div>
      </div>

      <div class="side-section">
        <div class="section-title">역할 선택</div>
        <div class="role-grid">
          <button class="role-btn active" data-role="all">전체</button>
          <button class="role-btn" data-role="tank">탱커</button>
          <button class="role-btn" data-role="dps">딜러</button>
          <button class="role-btn" data-role="support">힐러</button>
        </div>
      </div>

      <div class="side-section" style="display:flex;flex-direction:column;min-height:0;flex:1;">
        <div class="section-title">추천 질문</div>
        <div class="quick-list" id="quickList"></div>
      </div>

      <div class="status-card">
        <div class="status-title">최근 질문</div>
        <div class="recent-list" id="recentList"></div>
        <div class="status-row"><span>상태</span><span class="status-value" style="color:var(--success)">준비 완료</span>
        </div>
      </div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="title-group">
          <a class="icon-btn site-back" href="/" title="서비스 홈으로" aria-label="서비스 홈으로 돌아가기">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </a>
          <div class="title-wrap">
            <h1>오버워치 코치 AI</h1>
            <p>영웅 카운터, 조합, 맵 운영, 스탯 피드백을 질문해보세요.</p>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="mx-open-btn chat-only" id="matchupBtn" title="영웅 가이드(운영·특전·조합·상성)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l9 9"/><path d="M20 4l-9 9"/><path d="M3 8V4h4"/><path d="M21 8V4h-4"/><path d="M9 15l-4 5"/><path d="M15 15l4 5"/></svg>
            <span class="mx-open-label">영웅 가이드</span>
          </button>
          <button class="icon-btn chat-only" id="recordsBtn" title="내 기록" aria-label="내 기록">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
          </button>
          <button class="icon-btn" id="resetBtn" title="처음 화면(새 대화)" aria-label="처음 화면으로, 새 대화 시작">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          </button>
          <div class="more-wrap">
            <button class="icon-btn" id="moreBtn" title="더보기" aria-label="더보기" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </button>
            <div class="more-menu" id="moreMenu" role="menu" hidden>
              <button type="button" class="more-item" id="themeBtn" role="menuitemcheckbox" aria-checked="false">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/></svg>
                <span>야간 모드</span><span class="more-switch" aria-hidden="true"></span>
              </button>
              <button type="button" class="more-item" id="cardBattleBtn" role="menuitem">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="10" height="14" rx="2"/><path d="M15 4h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
                <span>카운터 카드 대결</span>
              </button>
              <button type="button" class="more-item" id="saveChatBtn" role="menuitem">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4"/><path d="M8 14h8v6H8z"/></svg>
                <span>대화 저장</span>
              </button>
              <button type="button" class="more-item" id="helpBtn" role="menuitem">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.2h.01"/></svg>
                <span>사용법 보기</span>
              </button>
            </div>
          </div>
          <div class="help-hint" id="helpHint">
            <span>처음 오셨나요?<br>⋯ 버튼에서 사용법을 볼 수 있어요.</span>
          </div>
        </div>
      </header>

      <div class="mobile-quick" id="mobileQuick"></div>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h2>지금 판, 뭐가 막혀요?</h2>
          <p>영웅을 누르거나, 스탯창을 올리거나, 그냥 적어도 돼요.</p>
          <button type="button" class="wl-hero" data-click="heroAskBtn">
            <span class="wl-faces" aria-hidden="true">
              <img src="{% static 'chat/hero_icons/아나.png' %}" alt="">
              <img src="{% static 'chat/hero_icons/겐지.png' %}" alt="">
              <img src="{% static 'chat/hero_icons/트레이서.png' %}" alt="">
            </span>
            <span class="wl-hero-text"><b>영웅으로 묻기</b><span>타자 없이 아이콘만 눌러서</span></span>
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M7 3 L13 9 L7 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="wl-cards">
            <button type="button" class="wl-card" data-click="uploadBtn">
              <span class="wl-ico blue"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M9 10v9"/></svg></span>
              <b>스탯창 분석</b>
            </button>
            <button type="button" class="wl-card" data-click="recordsBtn">
              <span class="wl-ico green"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></span>
              <b>내 기록</b>
            </button>
            <button type="button" class="wl-card" data-click="matchupBtn">
              <span class="wl-ico orange"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l9 9"/><path d="M20 4l-9 9"/><path d="M3 8V4h4"/><path d="M21 8V4h-4"/><path d="M9 15l-4 5"/><path d="M15 15l4 5"/></svg></span>
              <b>영웅 가이드</b>
            </button>
            <button type="button" class="wl-card" data-click="cardBattleBtn">
              <span class="wl-ico blue"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="10" height="14" rx="2"/><path d="M15 4h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg></span>
              <b>카운터 카드 대결</b>
            </button>
          </div>
          <div>
            <div class="wl-label">이렇게 물어봐도 돼요</div>
            <div class="sample-chips">
              <button class="chip" data-fill="겐지 카운터 알려줘">겐지 카운터 알려줘</button>
              <button class="chip" data-fill="나는 솔저76인데 킬 4 데스 8 딜 6000이야 어떻게 운영해야해?">나는 솔저76인데 킬 4 데스 8 딜 6000이야 어떻게 운영해야해?</button>
              <button class="chip" data-fill="왕의 길 수비 운영 알려줘">왕의 길 수비 운영 알려줘</button>
              <button class="chip" hidden data-fill="상대는 오리사, 리퍼, 파라, 루시우, 아나 이고 우리팀은 라인하르트, 리퍼, 트레이서, 브리기테 인데 나는 뭘 해야할까?">상대는 오리사, 리퍼, 파라, 루시우, 아나 이고 우리팀은 라인하르트, 리퍼, 트레이서, 브리기테 인데 나는 뭘 해야할까?</button>
              <button class="chip" hidden data-fill="리퍼를 하고 싶은데 상대 아나를 어떻게 처리해야할까?">리퍼를 하고 싶은데 상대 아나를 어떻게 처리해야할까?</button>
            </div>
            <button type="button" class="wl-more" data-more-examples>예시 더 보기 (조합 추천, 영웅 유지)</button>
          </div>
        </div>
      </section>

      <footer class="composer">
        <div class="hero-ask-row">
          <button type="button" class="hero-ask-btn" id="heroAskBtn"><svg class="ha-face-ph" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 19 Q4.5 13 11 13 Q17.5 13 18.5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="heroAskLabel">영웅으로 묻기</span></button>
          <button type="button" class="hero-again-btn" id="heroAgainBtn" hidden><span class="ha-faces" id="heroAgainFaces"></span>같은 영웅으로 묻기</button>
        </div>
        <div class="composer-tools">
          <div class="custom-select" id="mapSelect">
            <button type="button" class="select-trigger" id="mapTrigger"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="mapTriggerText">맵 선택</span></button>
            <div class="select-menu">
              <div class="select-search"><input type="text" id="mapSearch" placeholder="맵 이름 검색" autocomplete="off"></div>
              <div class="select-list" id="mapList"></div>
            </div>
          </div>
          <button type="button" class="death-btn" id="deathBtn" aria-label="죽었어요" title="죽었어요"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C7 3 4 6.5 4 11c0 3 1.5 4.5 3 5.5V20h10v-3.5c1.5-1 3-2.5 3-5.5 0-4.5-3-8-8-8z"/><circle cx="9" cy="11" r="1.6" fill="currentColor"/><circle cx="15" cy="11" r="1.6" fill="currentColor"/></svg><span class="death-label">죽었어요</span></button>
          <div class="side-toggle" id="sideToggle">
            <button class="side-btn" data-side="attack">공격</button>
            <button class="side-btn" data-side="defense">수비</button>
          </div>
          <div class="context-pill" id="contextPill">
            <span id="contextText"></span>
            <button type="button" id="clearContextBtn" aria-label="맵 선택 지우기">×</button>
          </div>
          <div class="style-toggle" id="styleToggle">
            <button type="button" class="style-btn active" data-style="simple" title="인게임 중 빠르게 볼 핵심 요약">간단히</button>
            <button type="button" class="style-btn" data-style="detailed" title="복기·학습용 자세한 설명">자세히</button>
            <button type="button" class="style-btn" data-style="command" title="간단히 형식을 짧은 명령조로">명령조</button>
          </div>
        </div>
        <div class="attach-preview" id="attachPreview" hidden>
          <img id="attachThumb" alt="첨부한 스탯창 이미지">
          <span class="attach-name" id="attachName"></span>
          <button type="button" class="attach-remove" id="attachRemove" title="첨부 취소" aria-label="첨부 취소">×</button>
        </div>

    const input = $('userInput');

    const AI_AVATAR_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><line x1="12" y1="8" x2="12" y2="4"/><circle cx="12" cy="3" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="14" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.6" fill="currentColor" stroke="none"/></svg>';

    function getCsrf() {
      // 쿠키를 우선 쓴다(메타 태그는 최초 로드 시점 값이라 뒤처질 수 있다).
      const cookie = document.cookie.split(';').map(v => v.trim()).find(v => v.startsWith('csrftoken='))?.split('=')[1];
      if (cookie) return decodeURIComponent(cookie);
      const meta = document.querySelector('meta[name="csrf-token"]');
      return (meta && meta.content) || '';
    }
    // 서버가 JSON 대신 HTML 오류 페이지를 돌려줬을 때 파싱 에러 대신
    // 사용자가 이해할 수 있는 메시지를 던진다.
    async function parseJsonOrThrow(res) {
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        throw new Error('서버 응답을 확인할 수 없습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.');
      }
      return res.json();
    }
    function timeText() { return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
    function escapeHtml(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function convertMarkdownTables(text) {
      // 파이프 표 블록을 한 줄짜리 <table> HTML로 변환한다.
      const lines = text.split('\n');
      const out = [];
      const splitRow = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let i = 0;
      while (i < lines.length) {
        const isRow = /^\|.*\|\s*$/.test(lines[i]);
        const nextIsSep = i + 1 < lines.length && /^\|[\s:\-|]+\|\s*$/.test(lines[i + 1]);
        if (isRow && nextIsSep) {
          const headerCells = splitRow(lines[i]);
          i += 2;
          const bodyRows = [];
          while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
            bodyRows.push(splitRow(lines[i]));
            i++;
          }
          let html = '<table class="md-table"><thead><tr>' + headerCells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
          bodyRows.forEach(r => { html += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
          html += '</tbody></table>';
          out.push(html);
        } else {
          out.push(lines[i]);
          i++;
        }
      }
      return out.join('\n');
    }
    function convertMarkdownLists(text) {
      // 목록 블록을 한 줄짜리 HTML로 만든다(줄바꿈을 남기면 <br>로 바뀐다).
      // 들여쓴 "- "는 한 단계 아래 목록으로 넣는다.
      const lines = text.split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length) {
        if (!/^\s*- \S/.test(lines[i])) { out.push(lines[i]); i++; continue; }
        let html = '<ul>';
        let nested = false;
        while (i < lines.length) {
          const m = lines[i].match(/^(\s*)- (.*)$/);
          if (!m) break;
          const isNested = m[1].replace(/\t/g, '  ').length >= 1;
          if (isNested && !nested) {
            html = html.replace(/<\/li>$/, '') + '<ul>';
            nested = true;
          } else if (!isNested && nested) {
            html += '</ul></li>';
            nested = false;
          }
          html += '<li>' + m[2] + '</li>';
          i++;
        }
        if (nested) html += '</ul></li>';
        out.push(html + '</ul>');
      }
      return out.join('\n');
    }
    function simpleMarkdown(text) {
      let s = escapeHtml(text || '');
      s = convertMarkdownTables(s);
      s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
      s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      s = convertMarkdownLists(s);
      s = s.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
      // <ul>은 블록 요소라 앞뒤 <br>은 빈 줄만 만든다.
      s = s.replace(/<br>\s*<ul>/g, '<ul>').replace(/<\/ul>\s*<br>/g, '</ul>');
      if (!/^<h|^<ul|^<p|^<table/.test(s)) s = '<p>' + s + '</p>';
      return s;
    }
    // "솔저76"의 숫자와 "스킬"의 "킬"은 스탯이 아니다.
    function hasStats(text) {
      const t = String(text || '').replace(/솔저\s*:?\s*76/g, '').replace(/스킬/g, '');
      return /\d/.test(t) && /(킬|데스|딜|힐|도움|어시|피해|치유|사망)/.test(t);
    }
    function contextLabel() {
      if (!state.map || state.map.mode === 'none') return '';
      let txt = `${state.map.name} · ${modeName[state.map.mode] || ''}`;
      if (state.side) txt += ` · ${state.side === 'attack' ? '공격' : '수비'}`;
      return txt;
    }
    function updateContext() {
      const hasMap = state.map && state.map.mode !== 'none';
      $('mapTriggerText').textContent = hasMap ? state.map.name : '맵 선택';
      $('mapTrigger').classList.toggle('has-map', !!hasMap);
      $('mapTrigger').title = hasMap ? `${state.map.name} (${modeName[state.map.mode]})` : '맵을 고르면 그 맵 기준으로 답해요';
      $('sideToggle').classList.toggle('show', hasMap && sideModes.has(state.map.mode));
      document.querySelectorAll('.side-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.side === state.side));
      const label = contextLabel();
      $('contextPill').classList.toggle('show', !!label);
      $('contextText').textContent = label;
    }
    function clearContext() {
      state.map = null; state.side = '';
      $('mapSearch').value = '';
      renderMapList(); updateContext(); closeSelect();
    }

    function renderMapList() {
      const q = $('mapSearch').value.trim().toLowerCase();
      const list = $('mapList');
      const filtered = maps.filter(m => !q || m.name.toLowerCase().includes(q) || m.group.toLowerCase().includes(q));
      if (!filtered.length) { list.innerHTML = '<div class="select-empty">검색 결과가 없습니다.</div>'; return; }

      filtered.forEach(m => {
        if (m.group !== last) { last = m.group; html += `<div class="select-group">${escapeHtml(last)}</div>`; }
        const active = state.map && state.map.name === m.name && state.map.mode === m.mode ? ' active' : '';
        html += `<button type="button" class="select-option${active}" data-name="${escapeHtml(m.name)}" data-mode="${escapeHtml(m.mode)}">${escapeHtml(m.name)}</button>`;
      });
      list.innerHTML = html;
    }
    function openSelect() { $('mapSelect').classList.add('open'); $('mapSearch').focus(); renderMapList(); }

    // ── 스탯창(TAB) 이미지 업로드 ──
    // 이미지를 고르면 입력창 위에 첨부만 해 두고, 전송할 때 질문과 함께 보낸다.
    const uploadBtn = $('uploadBtn');

    let pendingImage = null;
    let pendingImageUrl = null;

    function attachImage(file) {
      clearAttachedImage();
      pendingImage = file;
      pendingImageUrl = URL.createObjectURL(file);

      composerHint.hidden = false;
      input.focus();
    }
    function clearAttachedImage() {
      if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
      pendingImage = null; pendingImageUrl = null;
      attachThumb.removeAttribute('src');
      attachPreview.hidden = true;
      screenshotInput.value = '';
      composerHint.hidden = true;
    }
    $('attachRemove')?.addEventListener('click', () => { clearAttachedImage(); input.focus(); });

    const UPLOAD_ICON = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
    if (uploadBtn) uploadBtn.innerHTML = UPLOAD_ICON;

    function formatScoreboardResult(data) {
      // 표와 피드백은 서버가 마크다운으로 완성해서 내려준다.
      if (data.report) return `📋 스탯창 분석 결과\n\n${data.report}`;
      return '📋 스탯창을 분석했지만 표시할 내용이 없습니다.';
    }

    async function requestScoreboard(file, withFeedback) {
      const formData = new FormData();
      formData.append('image', file, file.name || 'scoreboard.png');
      formData.append('with_feedback', withFeedback ? '1' : '0');
      const res = await fetch('/chat/api/scoreboard/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCsrf() },
        body: formData,
      });
      const data = await parseJsonOrThrow(res);
      if (!res.ok || data.error) throw new Error(data.error || '이미지 분석에 실패했습니다.');
      return data;
    }

    // 질문이 있으면 표는 접어서 답 위에 붙이고, 없으면 지금처럼 표+코치 피드백을 보여준다.
    async function sendWithImage(file, text) {
      addMessage('user', text || '스탯창 분석해줘', { context: '스탯창 이미지 첨부', stats: text ? hasStats(text) : false, recent: Boolean(text) });
      input.value = ''; autoResize();
      clearAttachedImage();
      state.busy = true; sendBtn.disabled = true; uploadBtn.disabled = true; addTyping();
      try {
        const board = await requestScoreboard(file, !text);
        if (!text) {
          removeTyping();
          addMessage('ai', formatScoreboardResult(board), { turnId: board.turn_id, match: board.match, matchId: board.turn_id });
          return;
        }
        const body = buildRequestBody(text);
        body.scoreboard_turn_id = board.turn_id;
        const data = await requestChat(body);
        removeTyping();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card, scoreboardTable: board.report, match: board.match, matchId: board.turn_id });
      } catch (err) {
        removeTyping(); showError(err.message || '이미지 분석에 실패했습니다.');
      } finally {
        state.busy = false; sendBtn.disabled = false; uploadBtn.disabled = false; input.focus();
      }
    }

    // 업로드 버튼을 누를 때마다 캡쳐 방법 안내 모달을 띄운다(매번).
    function openScoreboardGuideModal(onConfirm) {
      const overlay = document.createElement('div'); overlay.className = 'save-modal-overlay';
      const modal = document.createElement('div'); modal.className = 'save-modal';
      modal.innerHTML = `
        <div class="save-modal-header">
          <h3>스탯창 이미지 올리는 법</h3>
          <button type="button" class="save-modal-close" id="scoreboardGuideCloseBtn">×</button>
        </div>
        <div class="save-modal-sub">인게임에서 Tab 키를 눌렀을 때 나오는 K/D/A 스탯창 화면을 캡쳐해서 올려주세요.<br><br>⚠️ 휴대폰으로 화면을 촬영한 사진이 아니라, 반드시 PC 화면 캡쳐(스크린샷)로 올려야 정확하게 분석돼요.</div>
        <button type="button" class="save-modal-save-btn" id="scoreboardGuideConfirmBtn">확인했어요</button>
      `;
      overlay.appendChild(modal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      modal.querySelector('#scoreboardGuideCloseBtn').addEventListener('click', () => overlay.remove());

    // ── 영웅 가이드(상성표) 모달 ──
    // 내용은 /chat/api/matchups/에서 받은 값만 띄운다(서버가 문서에서 읽은 값).
    const matchupCache = { roles: null, heroes: {}, guides: {} };
    const ROLE_LABELS = { tank: '탱커', damage: '딜러', support: '힐러' };
    // 받침에 따라 '이'/'가'(heroes.py와 같은 계산).
    const DIGIT_HAS_FINAL = { '0': true, '1': true, '2': false, '3': true, '4': false, '5': false, '6': true, '7': true, '8': true, '9': false };
    function josaIGa(word) {
      const text = String(word || '');
      const last = text[text.length - 1];
      if (last in DIGIT_HAS_FINAL) return DIGIT_HAS_FINAL[last] ? '이' : '가';
      const code = text.charCodeAt(text.length - 1);
      return (code >= 0xAC00 && code <= 0xD7A3 && (code - 0xAC00) % 28 !== 0) ? '이' : '가';
    }
    const MATCHUP_GROUPS = [
      { key: 'hard', title: (hero) => `${hero}에게 강한 영웅`, badge: (score) => `불리 ${score}/5` },
      { key: 'easy', title: (hero) => `${hero}${josaIGa(hero)} 강한 영웅`, badge: (score) => `유리 ${score}/5` },
      { key: 'mixed', title: () => '상황에 따라 갈림', badge: () => '팽팽' },
    ];
    let matchupOverlay = null;
    let matchupRole = 'tank';
    let matchupCurrent = null;  // 지금 보고 있는 영웅의 상성
    let matchupListScroll = 0;  // 상대 상세에서 돌아올 때 목록 스크롤 위치
    let guideTab = 'play';
    let foeFrom = 'chart';      // 상대 상세의 뒤로가기 대상(가이드 상성 탭 / 전체 상성표)
    const GUIDE_TABS = [['play', '운영'], ['perk', '특전'], ['team', '조합'], ['matchup', '상성']];
    function josaEuro(word) {
      const text = String(word || '');
      const last = text[text.length - 1];
      if (last in DIGIT_HAS_FINAL) return DIGIT_HAS_FINAL[last] && !'178'.includes(last) ? '으로' : '로';
      const code = text.charCodeAt(text.length - 1) - 0xAC00;
      if (code < 0 || code > 11171) return '로';
      const final = code % 28;
      return final === 0 || final === 8 ? '로' : '으로';
    }

    async function fetchMatchups(hero) {
      const url = hero ? `/chat/api/matchups/?hero=${encodeURIComponent(hero)}` : '/chat/api/matchups/';
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const data = await parseJsonOrThrow(res);
      if (!res.ok || data.error) throw new Error(data.error || '상성표를 불러오지 못했습니다.');
      return data;
    }

    function renderMatchupDetail(data, scrollTop = 0) {
      const body = matchupBody();
      if (!body) return;
      matchupCurrent = data;
      const groups = MATCHUP_GROUPS.map(group => {
        const items = data[group.key] || [];
        // 서버가 역할 순으로 정렬해 보내므로 역할이 바뀌는 자리에서 칸 묶음을 나눈다.
        const byRole = [];
        items.forEach((item, index) => {
          const last = byRole[byRole.length - 1];
          if (!last || last.role !== item.role) byRole.push({ role: item.role, tiles: [] });
          byRole[byRole.length - 1].tiles.push(`
            <button type="button" class="mx-foe" data-mx-foe="${group.key}:${index}">

          <div class="mx-foe-grid">${chunk.tiles.join('')}</div>`).join('');

    function guideMatchupGroup(data, key, title, extra) {
      const group = MATCHUP_GROUPS.find(g => g.key === key);
      const items = (data[key] || []).map((item, index) => ({ item, index }))
        .sort((a, b) => b.item.score - a.item.score);
      if (!items.length) return '';
      const more = items.length > 3 ? `<span class="gd-more">외 ${items.length - 3}명</span>` : '';
      return `
        <section class="gd-card mx-group-${key}">
          <div class="gd-card-head"><span class="gd-card-title gd-${key}">${title}</span>${more}</div>
          <div class="gd-foe-grid">${items.slice(0, 3).map(({ item, index }) => guideTile(item, group, index)).join('')}</div>
          ${extra || ''}
        </section>`;
    }

    function perkMouseIcon(key) {
      if (key !== '좌클릭' && key !== '우클릭') return '';
      const fill = key === '좌클릭' ? 'M7 1 A6 6 0 0 0 1 7 V8 H7 Z' : 'M7 1 A6 6 0 0 1 13 7 V8 H7 Z';
      return `<svg class="gd-mouse" viewBox="0 0 14 20" width="12" height="17" role="img" aria-label="${key}"><title>${key}</title>`
        + `<path d="${fill}" class="gd-mouse-on"></path>`
        + `<rect x="1" y="1" width="12" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"></rect>`
        + `<path d="M7 1 V8 M1 8 H13" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>`;
    }

    function guideCta(tab, hero) {

    async function openMatchupModal() {

      overlay.className = 'save-modal-overlay';
      overlay.innerHTML = `
        <div class="mx-modal">
          <div class="mx-head">

        if (e.target.closest('#mxFoeBackBtn')) {
          if (foeFrom === 'guide') renderGuide('matchup'); else renderMatchupDetail(matchupCurrent, matchupListScroll);
          return;
        }
        const tabBtn = e.target.closest('[data-gd-tab]');

        if (e.target.closest('#mxChartBackBtn')) { renderGuide('matchup'); return; }

    function disableOldChoiceButtons() {
      // 새 메시지가 오면 이전 답변의 버튼은 전부 비활성화한다.
      messages.querySelectorAll('.suggest-btn').forEach(btn => {
