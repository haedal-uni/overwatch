      });
    }
    // 사이드바 "최근 질문": 직접 입력한 질문만, 최신순 3개(누르면 입력창에 다시 채운다).
    const MAX_RECENT_QUESTIONS = 3;
    function renderRecent() {
      const list = $('recentList');
      if (!list) return;
      const seen = new Set();
      const recent = [];
      for (let i = state.history.length - 1; i >= 0 && recent.length < MAX_RECENT_QUESTIONS; i--) {
        const m = state.history[i];
        if (m.role !== 'user' || !m.options?.recent || seen.has(m.text)) continue;
        seen.add(m.text); recent.push(m.text);
      }
      list.innerHTML = recent.length
        ? recent.map(q => `<button type="button" class="recent-item" data-fill="${escapeHtml(q)}" title="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join('')
        : '<div class="recent-empty">아직 질문이 없어요</div>';
    }

    function addMessage(role, text, options = {}) {
      $('welcome')?.remove();
      disableOldChoiceButtons();
      // 저장된 대화를 재생할 때는 history에 다시 쌓지 않도록 막는다.
      if (!options.skipHistory) {
        state.history.push({ role, text, options });
        if (options.recent) renderRecent();
      }
      const row = document.createElement('div');
      row.className = `msg ${role}`;
      const avatar = document.createElement('div'); avatar.className = 'avatar';
      if (role === 'user') avatar.textContent = '나'; else avatar.innerHTML = AI_AVATAR_ICON;
      const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${role === 'user' ? '나' : '코치 AI'} · ${timeText()}`;
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      bubble.innerHTML = options.deathTip ? '' : role === 'ai' ? simpleMarkdown(text) : `<p>${escapeHtml(text)}</p>`;
      if (options.deathTip && window.DeathBtn) bubble.appendChild(DeathBtn.buildCard(options.deathTip));
      if (role === 'user') {
        const badges = [];
        if (options.stats) badges.push('스탯 입력 감지');
        if (options.context) badges.push(options.context);
        if (badges.length) bubble.innerHTML += `<div class="badges">${badges.map(b => `<span class="badge">${escapeHtml(b)}</span>`).join('')}</div>`;
      }
      if (role === 'ai') {
        if (options.scoreboardTable) {
          const fold = document.createElement('details'); fold.className = 'scoreboard-fold';
          fold.innerHTML = `<summary>이번 판 스탯표 보기</summary><div class="fold-body">${simpleMarkdown(options.scoreboardTable)}</div>`;
          bubble.prepend(fold);
        }
        if (options.matchupCard) {
          const card = buildMatchupCard(options.matchupCard);
          if (card) bubble.appendChild(card);
        }
        if (options.recommendCard) {
          const card = buildRecommendCard(options.recommendCard);
          if (card) bubble.appendChild(card);
        }
        // 스탯창 분석 결과: 내 기록에 쌓고 결과 카드 버튼을 붙인다.
        if (options.match && window.MatchRecords) {
          const bar = MatchRecords.actionBar(options.match, options.matchId);
          if (bar) bubble.appendChild(bar);
        }
        const buttons = buildResponseButtons(options);
        if (buttons) bubble.appendChild(buttons);
        if (options.turnId) bubble.appendChild(buildFeedbackUI(options.turnId));
      }
      wrap.appendChild(meta); wrap.appendChild(bubble);
      if (role === 'user' && options.heroes && window.HeroAsk) bubble.insertAdjacentHTML('beforebegin', HeroAsk.bubbleFaces(options.heroes));
      row.appendChild(avatar); row.appendChild(wrap);
      messages.appendChild(row);
      if (role === 'ai') revealAiMessage(row); else messages.scrollTop = messages.scrollHeight;
    }
    // 긴 답변은 맨 아래로 바로 점프하지 않고, 위부터 보여준 뒤 아래로 스크롤한다.
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    async function revealAiMessage(row) {
      const topTarget = Math.max(0, row.offsetTop - 14);
      const isTall = row.offsetHeight > messages.clientHeight * 0.7;
      if (isTall) {
        messages.scrollTo({ top: topTarget, behavior: 'smooth' });
        await sleep(1300);
        messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
      } else {
        messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
      }
    }
    function buildMatchupCard(card) {
      const hardHeroes = card?.hard_heroes || [];
      const easyHeroes = card?.easy_heroes || [];
      if (!hardHeroes.length && !easyHeroes.length) return null;

      const wrap = document.createElement('div'); wrap.className = 'matchup-card';
      const title = document.createElement('div'); title.className = 'matchup-card-title';
      title.textContent = `${card.subject || ''} 상성 카드`;
      wrap.appendChild(title);

      const buildCol = (labelText, items, kind) => {
        if (!items.length) return null;
        const col = document.createElement('div'); col.className = `matchup-col matchup-col-${kind}`;
        const colTitle = document.createElement('div'); colTitle.className = 'matchup-col-title';
        colTitle.textContent = labelText;
        col.appendChild(colTitle);
        items.forEach(item => {
          const row = document.createElement('div'); row.className = 'matchup-item';
          const icon = document.createElement('img'); icon.className = 'matchup-hero-icon'; icon.src = heroIcon(item.hero); icon.alt = item.hero || '';
          icon.onerror = () => icon.remove();
          const hero = document.createElement('span'); hero.className = 'matchup-hero'; hero.textContent = item.hero || '';
          const note = document.createElement('span'); note.className = 'matchup-note'; note.textContent = item.note || '';
          row.appendChild(icon); row.appendChild(hero); row.appendChild(note);
          col.appendChild(row);
        });
        return col;
      };

      const hardCol = buildCol('상대하기 어려운 영웅', hardHeroes, 'hard');
      const easyCol = buildCol('상대하기 쉬운 영웅', easyHeroes, 'easy');
      if (hardCol) wrap.appendChild(hardCol);
      if (easyCol) wrap.appendChild(easyCol);
      return wrap;
    }
    function buildRecommendCard(card) {
      const heroes = card?.heroes || [];
      if (!heroes.length) return null;

      const wrap = document.createElement('div'); wrap.className = 'matchup-card';
      const title = document.createElement('div'); title.className = 'matchup-card-title';
      title.textContent = card.mode === 'composition' ? '조합 추천 영웅 카드' : '교체 추천 영웅 카드';
      wrap.appendChild(title);

      const col = document.createElement('div'); col.className = 'matchup-col matchup-col-recommend';
      const colTitle = document.createElement('div'); colTitle.className = 'matchup-col-title';
      colTitle.textContent = '추천 영웅';
      col.appendChild(colTitle);
      heroes.forEach(item => {
        const row = document.createElement('div'); row.className = 'matchup-item';
        const icon = document.createElement('img'); icon.className = 'matchup-hero-icon'; icon.src = heroIcon(item.hero); icon.alt = item.hero || '';
        icon.onerror = () => icon.remove();
        const hero = document.createElement('span'); hero.className = 'matchup-hero'; hero.textContent = item.hero || '';
        const note = document.createElement('span'); note.className = 'matchup-note'; note.textContent = item.note || '';
        row.appendChild(icon); row.appendChild(hero); row.appendChild(note);
        col.appendChild(row);
      });
      wrap.appendChild(col);
      // 추천 전체에 공통인 주의는 카드 맨 아래 한 줄로 둔다.
      if (card.caution) {
        const caution = document.createElement('div'); caution.className = 'matchup-caution';
        caution.textContent = `⚠ ${card.caution}`;
        wrap.appendChild(caution);
      }
      return wrap;
    }
    function buildResponseButtons(options) {
      const box = document.createElement('div'); box.className = 'suggestions';
      let has = false;
      (options.choiceButtons || []).forEach(item => {
        if (!item || !item.label) return;
        const btn = document.createElement('button'); btn.className = 'suggest-btn'; btn.textContent = item.label;
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          if (item.type === 'role_filter') sendRoleFilter(item.value, item.label);
          else if (item.type === 'focus_hero') sendFocusHero(item.value, item.label);
          else if (item.type === 'roster_size') sendRosterSize(item.value, item.label);
          // 버튼이 뜻하는 문장(예: "상대 트레이서")을 사용자가 입력한 것처럼 보낸다.
          else if (item.type === 'message') { if (!state.busy) { input.value = item.value; sendMessage(); } }
          else { input.value = item.label; autoResize(); input.focus(); }
        });
        box.appendChild(btn); has = true;
      });
      (options.suggested || []).slice(0, 3).forEach(q => {
        const btn = document.createElement('button'); btn.className = 'suggest-btn'; btn.textContent = q;
        // 누르면 입력창을 거치지 않고 바로 질문으로 보낸다.
        btn.addEventListener('click', () => { if (state.busy) return; input.value = q; autoResize(); sendMessage(); });
        box.appendChild(btn); has = true;
      });
      return has ? box : null;
    }
    function buildFeedbackUI(turnId) {
      const row = document.createElement('div'); row.className = 'feedback-row';
      const toggle = document.createElement('button');
      toggle.type = 'button'; toggle.className = 'feedback-toggle';
      toggle.textContent = '🙁 이 답변이 만족스럽지 않았나요?';

      const form = document.createElement('div'); form.className = 'feedback-form'; form.style.display = 'none';
      const textarea = document.createElement('textarea');
      textarea.placeholder = '어떤 점이 아쉬웠는지 알려주시면 개선에 도움이 됩니다.';
      const actions = document.createElement('div'); actions.className = 'feedback-actions';
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button'; cancelBtn.className = 'feedback-cancel'; cancelBtn.textContent = '취소';
      const submitBtn = document.createElement('button');
      submitBtn.type = 'button'; submitBtn.className = 'feedback-submit'; submitBtn.textContent = '제출';

      toggle.addEventListener('click', () => {
        const opening = form.style.display === 'none';
        form.style.display = opening ? 'flex' : 'none';
        if (opening) textarea.focus();
      });
      cancelBtn.addEventListener('click', () => { form.style.display = 'none'; textarea.value = ''; });
      submitBtn.addEventListener('click', async () => {
        const reason = textarea.value.trim();
        if (!reason) { textarea.focus(); return; }
        submitBtn.disabled = true; submitBtn.textContent = '전송 중...';
        try {
          const res = await fetch('/chat/api/feedback/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
            body: JSON.stringify({ turn_id: turnId, reason })
          });
          const data = await parseJsonOrThrow(res);
          if (!res.ok || data.error) throw new Error(data.error || '피드백 전송에 실패했습니다.');
          const done = document.createElement('div'); done.className = 'feedback-done';
          done.textContent = '피드백을 보내주셔서 감사합니다.';
          row.replaceChildren(done);
        } catch (err) {
          submitBtn.disabled = false; submitBtn.textContent = '제출';
          alert(err.message || '피드백 전송에 실패했습니다.');
        }
      });

      actions.appendChild(cancelBtn); actions.appendChild(submitBtn);
      form.appendChild(textarea); form.appendChild(actions);
      row.appendChild(toggle); row.appendChild(form);
      return row;
    }
    function addTyping() {
      const row = document.createElement('div'); row.className = 'msg ai'; row.id = 'typing';
      row.innerHTML = `<div class="avatar">${AI_AVATAR_ICON}</div><div class="bubble-wrap"><div class="meta">코치 AI</div><div class="bubble"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>답변을 준비하고 있습니다.</span></div></div></div>`;
      messages.appendChild(row); messages.scrollTop = messages.scrollHeight;
    }
    function removeTyping() { $('typing')?.remove(); }
    function showError(msg) {
      const div = document.createElement('div'); div.className = 'error'; div.textContent = msg;
      messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
    }
    function buildRequestBody(message, roleFilter, focusHero, rosterSize) {
      const body = { message: message || '', answer_style: state.answerStyle };
      if (roleFilter) body.role_filter = roleFilter;
      if (focusHero) body.focus_hero = focusHero;
      if (rosterSize) body.roster_size = Number(rosterSize);
      const extra = {};
      if (state.map && state.map.mode !== 'none') extra.map_name = state.map.name;
      if (state.side) extra.side = state.side;
      if (Object.keys(extra).length) body.extra_context = extra;
      return body;
    }
    async function requestChat(body) {
      const res = await fetch('/chat/api/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
        body: JSON.stringify(body)
      });
      const data = await parseJsonOrThrow(res);
      if (!res.ok || data.error) throw new Error(data.error || '응답 중 오류가 발생했습니다.');
      return data;
    }
    // "영웅으로 묻기"가 만든 질문이면 말풍선 위에 고른 영웅 얼굴을 붙인다.
    let pendingHeroes = null;
    async function sendMessage() {
      const text = input.value.trim();
      if (state.busy) return;
      const heroes = pendingHeroes;
      pendingHeroes = null;
      if (pendingImage) { sendWithImage(pendingImage, text); return; }
      if (!text) return;
      const ctx = contextLabel();
      addMessage('user', text, { stats: hasStats(text), context: ctx, recent: true, heroes });
      input.value = ''; autoResize();
      state.busy = true; sendBtn.disabled = true; addTyping();
      try {
        const data = await requestChat(buildRequestBody(text));
        removeTyping();
        if (window.OwEvents) OwEvents.chat();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card });
      } catch (err) {
        removeTyping(); showError(err.message || '연결에 실패했습니다.');
      } finally {
        state.busy = false; sendBtn.disabled = false; input.focus();
      }
    }
    async function sendRoleFilter(value, label) {
      if (state.busy) return;
      const roleLabel = label || ({ all: '전체', tank: '탱커', damage: '딜러', support: '힐러' }[value]) || value;
      addMessage('user', roleLabel, { context: '역할 선택' });
      state.busy = true; sendBtn.disabled = true; addTyping();
      try {
        const data = await requestChat(buildRequestBody('', value));
        removeTyping();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card });
      } catch (err) { removeTyping(); showError(err.message || '연결에 실패했습니다.'); }
      finally { state.busy = false; sendBtn.disabled = false; }
    }
    async function sendRosterSize(value, label) {
      if (state.busy) return;
      addMessage('user', label || `${value}대${value}예요`, { context: '인원수 선택' });
      state.busy = true; sendBtn.disabled = true; addTyping();
      try {
        const data = await requestChat(buildRequestBody('', null, null, value));
        removeTyping();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card });
      } catch (err) { removeTyping(); showError(err.message || '연결에 실패했습니다.'); }
      finally { state.busy = false; sendBtn.disabled = false; }
    }
    async function sendFocusHero(value, label) {
      if (state.busy) return;
      addMessage('user', label || value, { context: '영웅 선택' });
      state.busy = true; sendBtn.disabled = true; addTyping();
      try {
        const data = await requestChat(buildRequestBody('', null, value));
        removeTyping();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card });
      } catch (err) { removeTyping(); showError(err.message || '연결에 실패했습니다.'); }
      finally { state.busy = false; sendBtn.disabled = false; }
    }
    sendBtn.addEventListener('click', sendMessage);

    function resetScreen() {
      state.answerStyle = 'simple';
      state.history = [];
      renderRecent();
      document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === 'simple'));
      clearContext();
      clearAttachedImage();
      messages.innerHTML = WELCOME_HTML;
    }
    async function resetServer() {
      try {
        await fetch('/chat/api/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() }, body: JSON.stringify({ reset: true }) });
      } catch (e) { }
    }
    $('resetBtn').addEventListener('click', () => { resetScreen(); resetServer(); });
    $('themeBtn').addEventListener('click', () => {
      const html = document.documentElement;
      const dark = html.dataset.theme === 'dark';
      html.dataset.theme = dark ? 'light' : 'dark';
      $('themeBtn').setAttribute('aria-checked', String(!dark));
    });

    // 더보기(⋯) 메뉴. 메뉴 밖을 누르거나 Esc, 메뉴 항목(야간 모드 제외)을 누르면 닫힌다.
    const moreBtn = $('moreBtn');
    const moreMenu = $('moreMenu');
    function setMoreMenu(open) {
      moreMenu.hidden = !open;
      moreBtn.setAttribute('aria-expanded', String(open));
    }
    moreBtn.addEventListener('click', (e) => { e.stopPropagation(); setMoreMenu(moreMenu.hidden); });
    moreMenu.addEventListener('click', (e) => { if (e.target.closest('#saveChatBtn, #helpBtn, #cardBattleBtn')) setMoreMenu(false); });
    document.addEventListener('click', (e) => { if (!moreMenu.hidden && !moreMenu.contains(e.target)) setMoreMenu(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !moreMenu.hidden) setMoreMenu(false); });

    // ── 사용법 투어 ──
    // 처음 접속한 사용자에게만 help 버튼 옆에 말풍선을 5초간 보여준다.
    const HELP_HINT_SEEN_KEY = 'owcoach_help_hint_seen';
    const helpBtn = $('helpBtn');
    const helpHint = $('helpHint');

    function showHelpHintOnce() {
      if (localStorage.getItem(HELP_HINT_SEEN_KEY)) return;
      localStorage.setItem(HELP_HINT_SEEN_KEY, '1');
      helpHint.classList.add('show');
      setTimeout(() => helpHint.classList.remove('show'), 5000);
    }
    showHelpHintOnce();

    // 추천 질문 위치는 화면 폭마다 달라 실제로 렌더링된 쪽을 순서대로 찾는다.
    function getVisibleEl(...selectors) {
      for (const sel of selectors) {
        const el = document.querySelector(sel);
        if (el && el.offsetParent !== null) return el;
      }
      return null;
    }

    const tourSteps = [
      {
        target: () => $('mapSelect'),
        title: '맵 선택',
        desc: '맵을 선택하면 해당 맵 기준으로 답변합니다.\n모르면 선택하지 않아도 괜찮아요.',
      },
      {
        target: () => getVisibleEl('#quickList', '#mobileQuick', '.sample-chips'),
        title: '추천 질문 버튼',
        desc: '처음 질문이 어렵다면 이 버튼을 눌러 질문 예시를 바로 넣을 수 있어요.',
      },
      {
        target: () => $('styleToggle'),
        title: '답변 스타일',
        desc: '간단히 / 자세히 / 명령조 중 원하는 답변을 선택할 수 있어요. 명령조는 간단히를 "위치 잡기"처럼 짧은 말로 줄여요.\n글로 답하는 질문에 적용되고, 카운터·조합 추천 카드는 차이가 거의 없어요.',
      },
      {
        target: () => document.querySelector('.input-box'),
        title: '입력창',
        desc: '게임 상황을 자유롭게 적어주세요.\n예: 겐지로 윈스턴 상대법 알려줘',
      },
      {
        target: () => $('uploadBtn'),
        title: '이미지 분석',
        desc: '인게임에서 Tab을 눌렀을 때 나오는 K/D/A 스탯창 화면을 캡쳐해서 올리면\n전적을 분석해서 코칭해드려요.',
      },
      {
        target: () => $('moreBtn'),
        title: '더보기',
        desc: '야간 모드, 대화 저장, 사용법 보기가 여기 있어요.\n대화는 최대 2개까지 저장할 수 있습니다.',
      },
    ];

    let tourStep = 0;
    let tourEls = null;

    function buildTourEls() {
      const top = document.createElement('div'); top.className = 'tour-dim';
      const bottom = document.createElement('div'); bottom.className = 'tour-dim';
      const left = document.createElement('div'); left.className = 'tour-dim';
      const right = document.createElement('div'); right.className = 'tour-dim';
      const highlight = document.createElement('div'); highlight.className = 'tour-highlight';
      const tooltip = document.createElement('div'); tooltip.className = 'tour-tooltip';
      tooltip.innerHTML = `
        <div class="tour-tooltip-step" id="tourStepLabel"></div>
        <div class="tour-tooltip-desc" id="tourDesc"></div>
        <div class="tour-tooltip-actions">
          <button type="button" class="tour-btn" id="tourEndBtn">종료</button>
          <button type="button" class="tour-btn" id="tourPrevBtn">이전</button>
          <button type="button" class="tour-btn primary" id="tourNextBtn">다음</button>
        </div>`;
      document.body.append(top, bottom, left, right, highlight, tooltip);
      const els = { top, bottom, left, right, highlight, tooltip };
      tooltip.querySelector('#tourEndBtn').addEventListener('click', closeTour);
      tooltip.querySelector('#tourPrevBtn').addEventListener('click', prevTourStep);
      tooltip.querySelector('#tourNextBtn').addEventListener('click', nextTourStep);
      return els;
    }

    function positionTour() {
      if (!tourEls) return;
      const step = tourSteps[tourStep];
      const target = step.target();
      if (!target) {
        // 이 단계의 대상이 화면에 없으면 다음 단계로 건너뛴다.
        if (tourStep < tourSteps.length - 1) { tourStep++; positionTour(); }
        else closeTour();
        return;
      }
      const rect = target.getBoundingClientRect();
      const pad = 8;
      const vw = window.innerWidth, vh = window.innerHeight;
      const r = {
        top: Math.max(rect.top - pad, 0),
        left: Math.max(rect.left - pad, 0),
        right: Math.min(rect.right + pad, vw),
        bottom: Math.min(rect.bottom + pad, vh),
      };

      Object.assign(tourEls.top.style, { top: '0px', left: '0px', width: vw + 'px', height: r.top + 'px' });
      Object.assign(tourEls.bottom.style, { top: r.bottom + 'px', left: '0px', width: vw + 'px', height: Math.max(vh - r.bottom, 0) + 'px' });
      Object.assign(tourEls.left.style, { top: r.top + 'px', left: '0px', width: r.left + 'px', height: Math.max(r.bottom - r.top, 0) + 'px' });
      Object.assign(tourEls.right.style, { top: r.top + 'px', left: r.right + 'px', width: Math.max(vw - r.right, 0) + 'px', height: Math.max(r.bottom - r.top, 0) + 'px' });
      Object.assign(tourEls.highlight.style, { top: r.top + 'px', left: r.left + 'px', width: Math.max(r.right - r.left, 0) + 'px', height: Math.max(r.bottom - r.top, 0) + 'px' });

      const tooltip = tourEls.tooltip;
      // 문구를 먼저 넣고 나서 크기를 잰다(이전 단계 높이로 위치를 잡으면 어긋난다).
      tooltip.querySelector('#tourStepLabel').textContent = `[${tourStep + 1}/${tourSteps.length}] ${step.title}`;
      tooltip.querySelector('#tourDesc').textContent = step.desc;

      // 툴팁은 대상 아래쪽에 공간이 있으면 아래, 없으면 위쪽에 배치하고 좌우는 화면 안으로 보정한다.
      tooltip.style.visibility = 'hidden';
      tooltip.style.maxHeight = '';
      const gap = 12, margin = 16;
      const spaceBelow = vh - r.bottom - gap - margin;
      const spaceAbove = r.top - gap - margin;
      const tw = tooltip.offsetWidth || 300;
      let th = tooltip.offsetHeight || 150;
      let top;
      if (th <= spaceBelow) {
        top = r.bottom + gap;
      } else if (th <= spaceAbove) {
        top = r.top - th - gap;
      } else {
        // 위아래 어디에도 안 들어가면 더 넓은 쪽에 붙이고 스크롤되게 한다.
        const useBelow = spaceBelow >= spaceAbove;
        const room = Math.max(useBelow ? spaceBelow : spaceAbove, 120);
        tooltip.style.maxHeight = room + 'px';
        th = Math.min(tooltip.offsetHeight, room);
        top = useBelow ? r.bottom + gap : Math.max(r.top - th - gap, margin);
      }
      const left = Math.min(Math.max(r.left, margin), Math.max(vw - tw - margin, margin));
      tooltip.style.top = top + 'px';
      tooltip.style.left = left + 'px';
      tooltip.style.visibility = 'visible';

      const prevBtn = tourEls.tooltip.querySelector('#tourPrevBtn');
      const nextBtn = tourEls.tooltip.querySelector('#tourNextBtn');
      prevBtn.disabled = tourStep === 0;
      nextBtn.textContent = tourStep === tourSteps.length - 1 ? '완료' : '다음';
    }

    function openTour() {
      helpHint.classList.remove('show');
      closeTour();
      tourStep = 0;
      tourEls = buildTourEls();
      positionTour();
      window.addEventListener('resize', positionTour);
      window.addEventListener('scroll', positionTour, true);
    }

    function closeTour() {
      if (!tourEls) return;
      Object.values(tourEls).forEach(el => el.remove());
      tourEls = null;
      window.removeEventListener('resize', positionTour);
      window.removeEventListener('scroll', positionTour, true);
    }

    // 페이드 없이 위치·텍스트를 한 번에 바꾼다(깜박임 방지).
    function goToTourStep(newStep) {
      if (!tourEls) return;
      tourStep = newStep;
      positionTour();
    }

    function nextTourStep() {
      if (tourStep >= tourSteps.length - 1) { closeTour(); return; }
      goToTourStep(tourStep + 1);
    }

    function prevTourStep() {
      if (tourStep <= 0) return;
      goToTourStep(tourStep - 1);
    }

    helpBtn.addEventListener('click', openTour);

    // ── 대화 저장/불러오기 ──
    // 저장 버튼을 눌렀을 때만 최대 2개까지 localStorage에 보관한다.
    const SAVED_CHATS_KEY = 'owcoach_saved_chats';
    const MAX_SAVED_CHATS = 2;

    function getSavedChats() {
      try {
        const list = JSON.parse(localStorage.getItem(SAVED_CHATS_KEY) || '[]');
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    }
    function setSavedChats(list) {
      try { localStorage.setItem(SAVED_CHATS_KEY, JSON.stringify(list)); } catch (e) { }
    }
    function formatSavedAt(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} `
        + `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    function buildSaveTitle() {
      const firstUser = state.history.find(m => m.role === 'user');
      const raw = (firstUser && firstUser.text) ? firstUser.text : '대화';
      return raw.length > 24 ? raw.slice(0, 24) + '…' : raw;
    }

    let saveModalEls = null;

    function closeSaveModal() {
      if (!saveModalEls) return;
      saveModalEls.overlay.remove();
      saveModalEls = null;
    }

    function renderSaveModal() {
      if (!saveModalEls) return;
      const saved = getSavedChats();
      const atLimit = saved.length >= MAX_SAVED_CHATS;
      const hasCurrent = state.history.length > 0;

      const saveBtn = saveModalEls.saveBtn;
      saveBtn.disabled = !hasCurrent || atLimit;
      saveBtn.textContent = !hasCurrent
        ? '저장할 대화가 없어요'
        : atLimit
          ? '최대 2개까지 저장할 수 있어요'
          : '지금 보고 있는 대화 저장';

      const list = saveModalEls.list;
      list.innerHTML = '';
      if (!saved.length) {
        const empty = document.createElement('div');
        empty.className = 'save-chat-empty';
        empty.textContent = '아직 저장된 대화가 없습니다. 최대 2개까지 저장할 수 있어요.';
        list.appendChild(empty);
        return;
      }
      saved.forEach(entry => {
        const card = document.createElement('div'); card.className = 'save-chat-card';
        const title = document.createElement('div'); title.className = 'save-chat-card-title';
        title.textContent = entry.title || '대화';
        const meta = document.createElement('div'); meta.className = 'save-chat-card-meta';
        meta.textContent = `${formatSavedAt(entry.savedAt)} · 메시지 ${(entry.messages || []).length}개`;
        const actions = document.createElement('div'); actions.className = 'save-chat-card-actions';
        const loadBtn = document.createElement('button'); loadBtn.type = 'button';
        loadBtn.className = 'save-chat-load'; loadBtn.textContent = '불러오기';
        loadBtn.addEventListener('click', () => loadSavedChat(entry.id));
        const delBtn = document.createElement('button'); delBtn.type = 'button';
        delBtn.className = 'save-chat-delete'; delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => deleteSavedChat(entry.id));
        actions.appendChild(loadBtn); actions.appendChild(delBtn);
        card.appendChild(title); card.appendChild(meta); card.appendChild(actions);
        list.appendChild(card);
      });
    }

    function openSaveModal() {
      closeSaveModal();
      const overlay = document.createElement('div'); overlay.className = 'save-modal-overlay';
      const modal = document.createElement('div'); modal.className = 'save-modal';
      modal.innerHTML = `
        <div class="save-modal-header">
          <h3>대화 저장</h3>
          <button type="button" class="save-modal-close" id="saveModalCloseBtn">×</button>
        </div>
        <div class="save-modal-sub">최대 2개까지 대화 기록을 저장하고 나중에 다시 불러볼 수 있어요.</div>
        <button type="button" class="save-modal-save-btn" id="saveModalSaveBtn"></button>
        <div class="save-chat-list" id="saveChatList"></div>`;
      overlay.appendChild(modal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSaveModal(); });
      document.body.appendChild(overlay);

      saveModalEls = {
        overlay,
        saveBtn: modal.querySelector('#saveModalSaveBtn'),
        list: modal.querySelector('#saveChatList'),
      };
      modal.querySelector('#saveModalCloseBtn').addEventListener('click', closeSaveModal);
      saveModalEls.saveBtn.addEventListener('click', saveCurrentChat);
      renderSaveModal();
    }

    function saveCurrentChat() {
      if (!state.history.length) return;
      const saved = getSavedChats();
      if (saved.length >= MAX_SAVED_CHATS) return;
      saved.push({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        savedAt: Date.now(),
        title: buildSaveTitle(),
        answerStyle: state.answerStyle,
        messages: JSON.parse(JSON.stringify(state.history)),
      });
      setSavedChats(saved);
      renderSaveModal();
    }

    function deleteSavedChat(id) {
      setSavedChats(getSavedChats().filter(entry => entry.id !== id));
      renderSaveModal();
    }

    function loadSavedChat(id) {
      const entry = getSavedChats().find(item => item.id === id);
      if (!entry) return;
      if (!confirm('지금 보고 있는 대화 내용은 사라집니다. 저장된 대화를 불러올까요?')) return;

      $('welcome')?.remove();
      messages.innerHTML = '';
      state.answerStyle = ['simple', 'command'].includes(entry.answerStyle) ? entry.answerStyle : 'detailed';
      document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === state.answerStyle));
      // 재생 중에는 history에 쌓지 않고, 끝난 뒤 불러온 내용으로 history를 채운다.
      (entry.messages || []).forEach(m => addMessage(m.role, m.text, { ...(m.options || {}), skipHistory: true }));
      state.history = (entry.messages || []).map(m => ({ role: m.role, text: m.text, options: m.options }));
      renderRecent();
      closeSaveModal();
    }

    $('saveChatBtn').addEventListener('click', openSaveModal);

    renderMapList(); updateContext(); renderRecent();
  </script>
</body>

</html>
