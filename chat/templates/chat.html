<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>오버워치 코치 AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef5ff;
      --bg2: #f8fbff;
      --card: rgba(255, 255, 255, .86);
      --card-solid: #ffffff;
      --line: #dbe7fb;
      --line-strong: #bcd1f5;
      --text: #132033;
      --muted: #6b7a92;
      --soft: #f3f7ff;
      --primary: #2563eb;
      --primary2: #4f8cff;
      --primary-soft: #eaf1ff;
      --accent: #ff9f1c;
      --danger: #ef4444;
      --success: #16a34a;
      --shadow: 0 22px 60px rgba(33, 74, 132, .14);
      --radius: 28px;
    }

    html[data-theme="dark"] {
      --bg: #081120;
      --bg2: #0e1a2f;
      --card: rgba(15, 28, 49, .84);
      --card-solid: #101d33;
      --line: #203756;
      --line-strong: #315783;
      --text: #eef6ff;
      --muted: #a9b8cc;
      --soft: #13233a;
      --primary: #5aa2ff;
      --primary2: #79b7ff;
      --primary-soft: #102a4f;
      --accent: #ffb84d;
      --danger: #ff6b6b;
      --success: #5ee087;
      --shadow: 0 22px 60px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      min-height: 100vh;
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 8%, rgba(37, 99, 235, .16), transparent 32%),
        radial-gradient(circle at 84% 12%, rgba(255, 159, 28, .15), transparent 34%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      height: 100vh;
      padding: 22px;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 18px;
    }

    .panel,
    .chat-shell {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .panel {
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 4px 18px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-size: 23px;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .25);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .side-section {
      padding: 18px 0;
      border-bottom: 1px solid var(--line)
    }

    .side-section:last-child {
      border-bottom: 0
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .08em;
      margin-bottom: 10px
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .role-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      transition: .16s;
    }

    .role-btn:hover,
    .role-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      min-height: 0;
      max-height: 260px;
      padding-right: 3px
    }

    .quick-btn {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 16px;
      padding: 11px 12px;
      line-height: 1.45;
      font-size: 13px;
      transition: .16s;
    }

    .quick-btn:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(37, 99, 235, .12)
    }

    .quick-tag {
      display: block;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px
    }

    .status-card {
      margin-top: auto;
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-soft), transparent);
      border: 1px solid var(--line);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px
    }

    .status-row:first-child {
      margin-top: 0
    }

    .status-value {
      font-weight: 800;
      color: var(--text)
    }

    .chat-shell {
      border-radius: var(--radius);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, .3), transparent);
    }

    html[data-theme="dark"] .topbar {
      background: linear-gradient(180deg, rgba(255, 255, 255, .03), transparent)
    }

    .title-wrap h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.04em
    }

    .title-wrap p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    .help-hint {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 60;
      max-width: 240px;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 700;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .help-hint.show {
      opacity: 1;
      transform: translateY(0);
    }

    .help-hint::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 14px;
      width: 12px;
      height: 12px;
      background: var(--card-solid);
      border-left: 1px solid var(--line-strong);
      border-top: 1px solid var(--line-strong);
      transform: rotate(45deg);
    }

    /* ── 사용법 투어 ──
       top/left/width/height는 transition을 적용하지 않는다(즉시 이동) —
       설명 텍스트가 먼저 바뀌고 강조 박스가 뒤늦게 미끄러져 도착하는 것을
       막기 위해, 단계 전환은 opacity로만 사라짐/나타남을 표현하고 위치는
       투명한 상태에서 순간 이동시킨다(JS의 goToTourStep 참고). */
    .tour-dim {
      position: fixed;
      background: rgba(4, 10, 22, .62);
      z-index: 200;
      transition: opacity var(--tour-fade-ms, 150ms) ease;
    }

    .tour-highlight {
      position: fixed;
      z-index: 201;
      border-radius: 16px;
      box-shadow: 0 0 0 3px var(--primary), 0 0 32px rgba(37, 99, 235, .55);
      pointer-events: none;
      transition: opacity var(--tour-fade-ms, 150ms) ease;
    }

    .tour-tooltip {
      position: fixed;
      z-index: 202;
      max-width: 300px;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      transition: opacity var(--tour-fade-ms, 150ms) ease;
    }

    .tour-tooltip-step {
      font-size: 12px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: .04em;
      margin-bottom: 6px;
    }

    .tour-tooltip-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -.02em;
    }

    .tour-tooltip-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .tour-tooltip-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .tour-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      transition: .15s;
    }

    .tour-btn:hover:not(:disabled):not(.primary) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .tour-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .tour-btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
    }

    .tour-btn.primary:hover {
      color: #fff;
      opacity: .92;
    }

    /* ── 대화 저장 모달 ── */
    .save-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 22, .55);
      z-index: 300;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .save-modal {
      width: 100%;
      max-width: 460px;
      max-height: 85vh;
      overflow: auto;
      background: var(--card-solid);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .save-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .save-modal-header h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .save-modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }

    .save-modal-close:hover {
      color: var(--text);
    }

    .save-modal-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .save-modal-save-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
      border-radius: 14px;
      padding: 12px;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 18px;
      transition: .15s;
    }

    .save-modal-save-btn:hover:not(:disabled) {
      opacity: .92;
    }

    .save-modal-save-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .save-modal-limit-note {
      font-size: 12.5px;
      color: var(--accent);
      margin: -10px 0 16px;
    }

    .save-chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .save-chat-empty {
      font-size: 13px;
      color: var(--muted);
      padding: 18px 0;
      text-align: center;
    }

    .save-chat-card {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .save-chat-card-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save-chat-card-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .save-chat-card-actions {
      display: flex;
      gap: 8px;
    }

    .save-chat-card-actions button {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 0;
      font-size: 12.5px;
      font-weight: 700;
      transition: .15s;
    }

    .save-chat-card-actions .save-chat-load:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .save-chat-card-actions .save-chat-delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .icon-btn,
    .plain-btn {
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      height: 42px;
      border-radius: 14px;
      padding: 0 14px;
      font-weight: 800;
      transition: .16s;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px
    }

    .icon-btn:hover,
    .plain-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft)
    }

    .context-wrap {
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, .22);
    }

    html[data-theme="dark"] .context-wrap {
      background: rgba(255, 255, 255, .02)
    }

    .custom-select {
      position: relative;
      min-width: 0
    }

    .select-trigger {
      width: 100%;
      min-height: 48px;
      border: 1.5px solid var(--line-strong);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 18px;
      padding: 0 48px 0 16px;
      display: flex;
      align-items: center;
      text-align: left;
      font-weight: 700;
      transition: .16s;
      position: relative;
    }

    .select-trigger::after {
      content: '⌄';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-54%);
      color: var(--primary);
      font-size: 22px;
    }

    .select-trigger:hover,
    .custom-select.open .select-trigger {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .10)
    }

    .select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 50;
      background: var(--card-solid);
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      box-shadow: 0 24px 56px rgba(24, 54, 97, .22);
      overflow: hidden;
      display: none;
    }

    .custom-select.open .select-menu {
      display: block;
      animation: pop .14s ease-out
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(-5px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .select-search {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft)
    }

    .select-search input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card-solid);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .select-list {
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      transform: translateZ(0);
      padding: 10px;
      scrollbar-width: thin;
    }

    .select-group {
      margin: 10px 4px 6px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -.02em;
      background: var(--primary-soft);
      border: 1px solid rgba(37, 99, 235, .18);
      border-radius: 12px;
    }

    .select-option {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      transition: .12s;
    }

    .select-option:hover,
    .select-option.active {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .select-empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px
    }

    .side-toggle {
      display: none;
      gap: 6px;
      align-items: center;
      white-space: nowrap
    }

    .side-toggle.show {
      display: flex
    }

    .side-btn {
      height: 44px;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--muted);
      border-radius: 15px;
      padding: 0 15px;
      font-weight: 900;
    }

    .side-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    .context-pill {
      min-height: 42px;
      display: none;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .context-pill.show {
      display: flex
    }

    .context-pill button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      font-size: 16px
    }

    .messages {
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      margin: auto;
      max-width: 680px;
      text-align: center;
      padding: 34px 24px;
    }

    .hero-mark {
      width: 86px;
      height: 86px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      font-size: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
      box-shadow: 0 18px 38px rgba(37, 99, 235, .25);
    }

    .welcome h2 {
      font-size: 30px;
      letter-spacing: -.06em;
      margin-bottom: 10px
    }

    .welcome p {
      max-width: 760px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .sample-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
      margin-top: 22px
    }

    .chip {
      border: 1px solid var(--line-strong);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 13px;
    }

    .chip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fade .18s ease-out
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .msg.user {
      justify-content: flex-end
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid var(--line);
      flex: 0 0 auto
    }

    .msg.user .avatar {
      order: 2;
      background: var(--primary);
      color: white;
      border-color: var(--primary)
    }

    .bubble-wrap {
      max-width: min(780px, 78%)
    }

    .msg.user .bubble-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 5px 2px
    }

    .msg.user .meta {
      margin-right: 2px
    }

    .bubble {
      border: 1px solid var(--line);
      background: var(--card-solid);
      border-radius: 20px;
      padding: 10px 13px;
      line-height: 1.58;
      font-size: 14.5px;
      white-space: normal;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border-color: transparent;
      color: white;
      border-bottom-right-radius: 7px
    }

    .msg.ai .bubble {
      border-bottom-left-radius: 7px
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      font-size: 17px;
      margin: 12px 0 6px;
      color: var(--primary)
    }

    .bubble p {
      margin: 2px 0
    }

    .bubble ul,
    .bubble ol {
      padding-left: 18px;
      margin: 6px 0
    }

    .bubble strong {
      color: var(--primary)
    }

    .bubble .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13px;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    .bubble .md-table th,
    .bubble .md-table td {
      border: 1px solid var(--line);
      padding: 5px 8px;
      text-align: left;
    }

    .bubble .md-table th {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      white-space: nowrap;
    }

    .msg.user .bubble strong {
      color: white
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, .42);
      background: rgba(255, 255, 255, .16);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line)
    }

    .suggest-btn {
      border: 1px solid var(--line-strong);
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800
    }

    .suggest-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary)
    }

    .feedback-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line)
    }

    .feedback-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .feedback-toggle:hover {
      color: var(--danger)
    }

    .feedback-form {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feedback-form textarea {
      width: 100%;
      min-height: 60px;
      border: 1.5px solid var(--line-strong);
      border-radius: 14px;
      background: var(--card-solid);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      resize: vertical;
    }

    .feedback-form textarea:focus {
      border-color: var(--primary)
    }

    .feedback-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end
    }

    .feedback-submit,
    .feedback-cancel {
      border-radius: 12px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 800;
    }

    .feedback-submit {
      border: 0;
      background: var(--danger);
      color: white;
    }

    .feedback-submit:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .feedback-cancel {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }

    .feedback-done {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .matchup-card {
      margin-top: 10px;
      border: 1px solid var(--line);
      background: var(--card-solid);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .matchup-card-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
    }

    .matchup-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .matchup-col-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .matchup-col-hard .matchup-col-title {
      color: var(--danger)
    }

    .matchup-col-easy .matchup-col-title {
      color: var(--success)
    }

    .matchup-col-recommend .matchup-col-title {
      color: var(--primary)
    }

    .matchup-item {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13.5px;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .matchup-col-hard .matchup-item {
      border-color: rgba(239, 68, 68, .28)
    }

    .matchup-col-easy .matchup-item {
      border-color: rgba(22, 163, 74, .28)
    }

    .matchup-col-recommend .matchup-item {
      border-color: rgba(37, 99, 235, .28)
    }

    .matchup-hero {
      font-weight: 800;
      color: var(--text);
    }

    .matchup-note {
      color: var(--muted);
      font-size: 12.5px;
    }

    .matchup-note::before {
      content: "· ";
    }

    .typing {
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--muted)
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      animation: bounce 1.1s infinite ease-in-out
    }

    .dot:nth-child(2) {
      animation-delay: .15s
    }

    .dot:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        opacity: .3;
        transform: scale(.6)
      }

      40% {
        opacity: 1;
        transform: scale(1)
      }
    }

    .composer {
      padding: 16px 22px 20px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .25);
    }

    .style-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .style-toggle-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-right: 2px;
    }

    .style-btn {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 800;
      transition: .16s;
    }

    .style-btn:hover {
      border-color: var(--primary);
      color: var(--primary)
    }

    .style-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    html[data-theme="dark"] .composer {
      background: rgba(255, 255, 255, .02)
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border: 1.5px solid var(--line-strong);
      background: var(--card-solid);
      border-radius: 22px;
      padding: 10px;
    }

    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .10)
    }

    textarea {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 9px 6px;
      line-height: 1.55;
    }

    .send-btn {
      height: 42px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      padding: 0 18px;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .22);
    }

    .send-btn:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .upload-btn {
      height: 42px;
      width: 42px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card-solid);
      color: var(--text);
      border-radius: 15px;
      font-size: 18px;
      display: grid;
      place-items: center;
      transition: .16s;
    }

    .upload-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft)
    }

    .upload-btn:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .upload-spin {
      animation: upload-spin .8s linear infinite
    }

    @keyframes upload-spin {
      to {
        transform: rotate(360deg)
      }
    }

    .composer-hint {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      padding: 0 4px
    }

    .error {
      border: 1px solid rgba(239, 68, 68, .35);
      background: rgba(239, 68, 68, .08);
      color: var(--danger);
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 700
    }

    .mobile-quick {
      display: none;
      padding: 0 22px 12px;
      border-bottom: 1px solid var(--line);
      gap: 8px;
      overflow: auto
    }

    .mobile-quick button {
      white-space: nowrap
    }

    @media(max-width:1050px) {
      .app {
        grid-template-columns: 1fr
      }

      .panel {
        display: none
      }

      .mobile-quick {
        display: flex
      }

      .context-wrap {
        grid-template-columns: 1fr auto
      }

      .context-pill {
        grid-column: 1/-1;
        justify-self: start
      }

      .side-toggle {
        justify-self: end
      }
    }

    @media(max-width:720px) {
      html {
        font-size: 90%
      }

      body {
        overflow: auto;
        font-size: 90%
      }

      .app {
        height: 100dvh;
        padding: 0;
        gap: 0
      }

      .chat-shell {
        border-radius: 0;
        border: 0;
        box-shadow: none
      }

      .topbar {
        min-height: 62px;
        padding: 12px 14px
      }

      .title-wrap h1 {
        font-size: 17px
      }

      .title-wrap p {
        display: none
      }

      .plain-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 11px;
        border-radius: 13px;
        font-size: 12px
      }

      .actions {
        gap: 6px
      }

      .icon-btn {
        height: 38px;
        width: 38px;
        border-radius: 13px
      }

      /* 모바일에서는 역할 선택 / 추천 질문 영역을 숨김 */
      .mobile-quick {
        display: none !important
      }

      .context-wrap {
        padding: 10px 14px;
        grid-template-columns: 1fr
      }

      .custom-select {
        width: 100%
      }

      .select-trigger {
        min-height: 42px;
        border-radius: 16px;
        padding-left: 14px;
        font-size: 13px
      }

      .select-menu {
        border-radius: 18px
      }

      .select-list {
        max-height: 220px;
        padding: 8px
      }

      .select-group {
        font-size: 14px;
        padding: 7px 10px;
        margin: 8px 3px 5px
      }

      .select-option {
        font-size: 15px;
        padding: 10px 12px
      }

      .side-toggle {
        justify-self: start
      }

      .side-btn {
        height: 39px;
        border-radius: 13px;
        padding: 0 13px;
        font-size: 13px
      }

      .context-pill {
        min-height: 36px;
        font-size: 12px
      }

      .messages {
        padding: 16px 14px
      }

      .bubble-wrap {
        max-width: 88%
      }

      .bubble {
        font-size: 13px;
        padding: 8px 10px;
        line-height: 1.55
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 13px
      }

      .welcome {
        max-width: 100%;
        padding: 24px 10px;
        text-align: center
      }

      .hero-mark {
        width: 76px;
        height: 76px;
        border-radius: 27px;
        font-size: 34px;
        margin-bottom: 16px
      }

      .welcome h2 {
        font-size: 22px;
        line-height: 1.32;
        margin-bottom: 9px
      }

      .welcome p {
        font-size: 12.5px;
        line-height: 1.7;
        max-width: 100%
      }

      /* 빠른 버튼은 줄바꿈하지 않고 한 줄로 유지. 좌우로 음수 margin +
         동일한 padding을 줘서 .welcome의 좌우 여백보다 살짝 더 넓게
         스크롤 가능 영역을 확보한다(첫 버튼 "카운터"가 더 왼쪽에서
         시작). 마지막 버튼("영웅 유지") 뒤에도 padding을 둬서 컨테이너
         경계에 딱 붙어 잘려 보이지 않게 한다. */
      .sample-chips {
        flex-wrap: nowrap;
        justify-content: flex-start;
        gap: 6px;
        margin: 17px -8px 0;
        padding: 0 8px 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .sample-chips::-webkit-scrollbar {
        display: none
      }

      .chip {
        flex: 0 0 auto;
        padding: 7px 10px;
        font-size: 11px
      }

      .composer {
        padding: 11px 12px 12px
      }

      .style-toggle {
        margin-bottom: 8px
      }

      .style-toggle-label {
        display: none
      }

      .style-btn {
        padding: 5px 11px;
        font-size: 11.5px
      }

      .composer-hint {
        display: none
      }

      .input-box {
        border-radius: 20px;
        padding: 8px;
        gap: 8px
      }

      textarea {
        min-height: 38px;
        font-size: 13px;
        padding: 8px 5px
      }

      .send-btn {
        height: 38px;
        border-radius: 14px;
        padding: 0 13px;
        font-size: 13px
      }

      .upload-btn {
        height: 38px;
        width: 38px;
        border-radius: 14px;
        font-size: 16px
      }
    }

    @media(max-width:420px) {
      .bubble-wrap {
        max-width: 92%
      }

      .bubble {
        padding: 7px 10px;
        font-size: 12.8px
      }

      .select-list {
        max-height: 210px
      }
    }

    /* AI 답변 말풍선 가독성 개선 */
    .msg.ai .bubble {
      white-space: normal;
      line-height: 1.75;
      font-size: 15px;
    }

    /* AI 답변 문단 간격 */
    .msg.ai .bubble p {
      margin: 0 0 12px;
    }

    /* AI 답변 제목 간격 */
    .msg.ai .bubble h1,
    .msg.ai .bubble h2,
    .msg.ai .bubble h3 {
      margin: 16px 0 8px;
      line-height: 1.45;
    }

    /* AI 답변 목록 간격 */
    .msg.ai .bubble ul,
    .msg.ai .bubble ol {
      margin: 10px 0 14px;
      padding-left: 22px;
    }

    /* AI 답변 목록 항목 간격 */
    .msg.ai .bubble li {
      margin: 6px 0;
    }

    /* AI 답변 줄바꿈 간격 */
    .msg.ai .bubble br {
      display: block;
      content: "";
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="7" />
            <line x1="12" y1="1" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="1" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="23" y2="12" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <div>
          <div class="brand-title">오버워치 코치 AI</div>
          <div class="brand-sub">상황 기반 전술 상담</div>
        </div>
      </div>

      <div class="side-section">
        <div class="section-title">역할 선택</div>
        <div class="role-grid">
          <button class="role-btn active" data-role="all">전체</button>
          <button class="role-btn" data-role="tank">탱커</button>
          <button class="role-btn" data-role="dps">딜러</button>
          <button class="role-btn" data-role="support">지원가</button>
        </div>
      </div>

      <div class="side-section" style="display:flex;flex-direction:column;min-height:0;flex:1;">
        <div class="section-title">추천 질문</div>
        <div class="quick-list" id="quickList"></div>
      </div>

      <div class="status-card">
        <div class="status-row"><span>질문 수</span><span class="status-value" id="questionCount">0</span></div>
        <div class="status-row"><span>세션 시간</span><span class="status-value" id="sessionTime">00:00</span></div>
        <div class="status-row"><span>상태</span><span class="status-value" style="color:var(--success)">준비 완료</span>
        </div>
      </div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="title-wrap">
          <h1>오버워치 코치 AI</h1>
          <p>영웅 카운터, 조합, 맵 운영, 스탯 피드백을 질문해보세요.</p>
        </div>
        <div class="actions">
          <button class="icon-btn" id="themeBtn" title="테마 변경">🌙</button>
          <button class="icon-btn" id="saveChatBtn" title="대화 저장">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4"/><path d="M8 14h8v6H8z"/></svg>
          </button>
          <button class="icon-btn" id="helpBtn" title="사용법 보기">?</button>
          <button class="plain-btn" id="resetBtn">초기화</button>
          <div class="help-hint" id="helpHint">
            <span>처음 오셨나요?<br>? 버튼을 누르면 사용 방법을 볼 수 있어요.</span>
          </div>
        </div>
      </header>

      <div class="context-wrap">
        <div class="custom-select" id="mapSelect">
          <button type="button" class="select-trigger" id="mapTrigger">맵 선택 없이 질문하기</button>
          <div class="select-menu">
            <div class="select-search"><input type="text" id="mapSearch" placeholder="맵 이름 검색" autocomplete="off"></div>
            <div class="select-list" id="mapList"></div>
          </div>
        </div>

        <div class="side-toggle" id="sideToggle">
          <button class="side-btn" data-side="attack">공격</button>
          <button class="side-btn" data-side="defense">수비</button>
        </div>

        <div class="context-pill" id="contextPill">
          <span id="contextText"></span>
          <button type="button" id="clearContextBtn" aria-label="맵 선택 지우기">×</button>
        </div>
      </div>

      <div class="mobile-quick" id="mobileQuick"></div>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="hero-mark"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="5.4" x2="12" y2="8.2"/><line x1="12" y1="15.8" x2="12" y2="18.6"/><line x1="5.4" y1="12" x2="8.2" y2="12"/><line x1="15.8" y1="12" x2="18.6" y2="12"/></svg></div>
          <h2>게임 상황을 알려주세요</h2>
          <p>탱커·딜러·힐러 같은 역할을 말할 때는 “상대 탱커”, “아군 힐러”처럼 누구를 가리키는지<br>붙여서 써주시면 더 정확하게 이해할 수 있어요.</p>
          <div class="sample-chips">
            <button class="chip" data-fill="겐지 카운터 알려줘">카운터</button>
            <button class="chip" data-fill="상대는 오리사, 리퍼, 파라, 루시우, 아나 이고 우리팀은 라인하르트, 리퍼, 트레이서, 브리기테 인데 나는 뭘 해야할까?">조합 추천</button>
            <button class="chip" data-fill="왕의 길 수비 운영 알려줘">맵 운영</button>
            <button class="chip" data-fill="나는 솔저76인데 킬 4 데스 8 딜 6000이야 어떻게 운영해야해?">스탯 피드백</button>
            <button class="chip" data-fill="리퍼를 하고 싶은데 상대 아나를 어떻게 처리해야할까?">영웅 유지</button>
          </div>
        </div>
      </section>

      <footer class="composer">
        <div class="style-toggle" id="styleToggle">
          <span class="style-toggle-label">답변 스타일</span>
          <button type="button" class="style-btn" data-style="simple" title="인게임 중 빠르게 볼 핵심 요약">간단히</button>
          <button type="button" class="style-btn active" data-style="detailed" title="복기·학습용 자세한 설명">자세히</button>
        </div>
        <div class="input-box">
          <textarea id="userInput" rows="1" placeholder="질문을 입력하세요. Enter 전송, Shift+Enter 줄바꿈"></textarea>
          <input type="file" id="screenshotInput" accept="image/png,image/jpeg,image/webp" hidden>
          <button type="button" class="upload-btn" id="uploadBtn" title="점수판(TAB) 스크린샷 업로드"></button>
          <button class="send-btn" id="sendBtn">전송</button>
        </div>
        <div class="composer-hint">
          <span id="composerHintText">맵을 선택하면 해당 맵 기준으로 답변합니다.</span>
          <span>스탯은 자유 형식으로 입력해도 됩니다.</span>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const maps = [
      { group: '전체', name: '맵 선택 없이 질문하기', mode: 'none' },
      { group: '호위 · 공수 있음', name: '쓰레기촌', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '하바나', mode: 'escort' },
      { group: '혼합 · 공수 있음', name: '눔바니', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '미드타운', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '블리자드 월드', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '아이헨발데', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '왕의 길', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '파라이수', mode: 'hybrid' },
      { group: '혼합 · 공수 있음', name: '할리우드', mode: 'hybrid' },
      { group: '밀기 · 공수 없음', name: '뉴 퀸 스트리트', mode: 'push' },
      { group: '밀기 · 공수 없음', name: '이스페란사', mode: 'push' },
      { group: '밀기 · 공수 없음', name: '콜로세오', mode: 'push' },
      { group: '밀기 · 공수 없음', name: '루나사피', mode: 'push' },
      { group: '플래시포인트 · 공수 없음', name: '뉴 정크 시티', mode: 'flashpoint' },
      { group: '플래시포인트 · 공수 없음', name: '수라바사', mode: 'flashpoint' },
      { group: '플래시포인트 · 공수 없음', name: '아틀리스', mode: 'flashpoint' },
      { group: '쟁탈 · 공수 없음', name: '남극 반도', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '네팔', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '리장 타워', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '부산', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '사모아', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '오아시스', mode: 'control' },
      { group: '쟁탈 · 공수 없음', name: '일리오스', mode: 'control' },
      { group: '호위 · 공수 있음', name: '66번 국도', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '감시 기지: 지브롤터', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '도라도', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '리알토', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '샴발리 수도원', mode: 'escort' },
      { group: '호위 · 공수 있음', name: '서킷 로얄', mode: 'escort' }
    ];
    const sideModes = new Set(['escort', 'hybrid']);
    const modeName = { escort: '호위', hybrid: '혼합', push: '밀기', flashpoint: '플래시포인트', control: '쟁탈' };
    const quicks = {
      all: [['COUNTER', '파라 카운터 영웅 알려줘'], ['MAP', '왕의 길 수비 운영 알려줘'], ['COMP', '상대는 오리사, 리퍼, 파라, 루시우, 아나 이고 우리팀은 라인하르트, 리퍼, 트레이서, 브리기테 인데 나는 뭘 해야할까?'], ['STAT', '내 솔저76 킬 4 데스 8 딜 6000인데 뭘 고쳐야 해?']],
      tank: [['TANK', '라인하르트 방어막 관리 팁 알려줘'], ['TANK', 'D.Va 매트릭스 언제 써야 해?'], ['TANK', '둠피스트 진입 타이밍 알려줘']],
      dps: [['DPS', '겐지 질풍참 타이밍 알려줘'], ['DPS', '솜브라 EMP 타이밍 알려줘'], ['COUNTER', '트레이서 카운터 알려줘']],
      support: [['SUPPORT', '아나 수면총 타이밍 알려줘'], ['SUPPORT', '키리코 정화 언제 써야 해?'], ['SUPPORT', '루시우 밀기 맵 운영 알려줘']]
    };
    let state = { map: null, side: '', q: 0, start: Date.now(), busy: false, answerStyle: 'detailed', history: [] };

    const $ = (id) => document.getElementById(id);
    const messages = $('messages');
    const input = $('userInput');
    const sendBtn = $('sendBtn');
    const AI_AVATAR_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><line x1="12" y1="8" x2="12" y2="4"/><circle cx="12" cy="3" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="14" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.6" fill="currentColor" stroke="none"/></svg>';

    function getCsrf() {
      const meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) return meta.content;
      return document.cookie.split(';').map(v => v.trim()).find(v => v.startsWith('csrftoken='))?.split('=')[1] || '';
    }
    // 세션 만료/CSRF 토큰 불일치 등으로 서버가 JSON 대신 HTML 오류 페이지(403/404/500)를
    // 돌려줄 때, res.json()이 그대로 "Unexpected token '<' ... is not valid JSON" 같은
    // 원시 파싱 에러를 던지는 것을 막고 사용자가 이해할 수 있는 메시지로 바꿔준다.
    async function parseJsonOrThrow(res) {
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        throw new Error('서버 응답을 확인할 수 없습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.');
      }
      return res.json();
    }
    function timeText() { return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
    function escapeHtml(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function convertMarkdownTables(text) {
      // "| a | b |" 헤더 + "|---|---|" 구분선으로 시작하는 파이프 표 블록을
      // <table>로 변환한다. 표로 인식된 줄들은 내부 개행이 없는 한 줄짜리
      // HTML로 합쳐져서, simpleMarkdown의 나머지 줄 단위 치환(문단/줄바꿈)에
      // 영향을 받지 않는다.
      const lines = text.split('\n');
      const out = [];
      const splitRow = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let i = 0;
      while (i < lines.length) {
        const isRow = /^\|.*\|\s*$/.test(lines[i]);
        const nextIsSep = i + 1 < lines.length && /^\|[\s:\-|]+\|\s*$/.test(lines[i + 1]);
        if (isRow && nextIsSep) {
          const headerCells = splitRow(lines[i]);
          i += 2;
          const bodyRows = [];
          while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
            bodyRows.push(splitRow(lines[i]));
            i++;
          }
          let html = '<table class="md-table"><thead><tr>' + headerCells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
          bodyRows.forEach(r => { html += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
          html += '</tbody></table>';
          out.push(html);
        } else {
          out.push(lines[i]);
          i++;
        }
      }
      return out.join('\n');
    }
    function simpleMarkdown(text) {
      let s = escapeHtml(text || '');
      s = convertMarkdownTables(s);
      s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
      s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/^- (.*)$/gm, '<li>$1</li>');
      s = s.replace(/(<li>.*?<\/li>\n?)+/gs, m => '<ul>' + m + '</ul>');
      s = s.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
      if (!/^<h|^<ul|^<p|^<table/.test(s)) s = '<p>' + s + '</p>';
      return s;
    }
    function hasStats(text) { return /\d/.test(text) && /(킬|데스|딜|힐|도움|어시|피해|치유|사망)/.test(text); }
    function contextLabel() {
      if (!state.map || state.map.mode === 'none') return '';
      let txt = `${state.map.name} · ${modeName[state.map.mode] || ''}`;
      if (state.side) txt += ` · ${state.side === 'attack' ? '공격' : '수비'}`;
      return txt;
    }
    function updateContext() {
      const hasMap = state.map && state.map.mode !== 'none';
      $('mapTrigger').textContent = hasMap ? `${state.map.name} (${modeName[state.map.mode]})` : '맵 선택 없이 질문하기';
      $('sideToggle').classList.toggle('show', hasMap && sideModes.has(state.map.mode));
      document.querySelectorAll('.side-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.side === state.side));
      const label = contextLabel();
      $('contextPill').classList.toggle('show', !!label);
      $('contextText').textContent = label;
    }
    function clearContext() {
      state.map = null; state.side = '';
      $('mapSearch').value = '';
      renderMapList(); updateContext(); closeSelect();
    }

    function renderMapList() {
      const q = $('mapSearch').value.trim().toLowerCase();
      const list = $('mapList');
      const filtered = maps.filter(m => !q || m.name.toLowerCase().includes(q) || m.group.toLowerCase().includes(q));
      if (!filtered.length) { list.innerHTML = '<div class="select-empty">검색 결과가 없습니다.</div>'; return; }
      let html = ''; let last = '';
      filtered.forEach(m => {
        if (m.group !== last) { last = m.group; html += `<div class="select-group">${escapeHtml(last)}</div>`; }
        const active = state.map && state.map.name === m.name && state.map.mode === m.mode ? ' active' : '';
        html += `<button type="button" class="select-option${active}" data-name="${escapeHtml(m.name)}" data-mode="${escapeHtml(m.mode)}">${escapeHtml(m.name)}</button>`;
      });
      list.innerHTML = html;
    }
    function openSelect() { $('mapSelect').classList.add('open'); $('mapSearch').focus(); renderMapList(); }
    function closeSelect() { $('mapSelect').classList.remove('open'); }
    $('mapTrigger').addEventListener('click', () => $('mapSelect').classList.contains('open') ? closeSelect() : openSelect());
    $('mapSearch').addEventListener('input', renderMapList);
    $('mapList').addEventListener('click', (e) => {
      const btn = e.target.closest('.select-option'); if (!btn) return;
      state.map = { name: btn.dataset.name, mode: btn.dataset.mode };
      if (!sideModes.has(state.map.mode)) state.side = '';
      updateContext(); closeSelect();
    });
    document.addEventListener('click', (e) => { if (!$('mapSelect').contains(e.target)) closeSelect(); });
    $('clearContextBtn').addEventListener('click', clearContext);
    document.querySelectorAll('.side-btn').forEach(btn => btn.addEventListener('click', () => {
      state.side = state.side === btn.dataset.side ? '' : btn.dataset.side;
      updateContext();
    }));

    function renderQuick(role = 'all') {
      const items = quicks[role] || quicks.all;
      const html = items.map(([tag, q]) => `<button class="quick-btn" data-fill="${escapeHtml(q)}"><span class="quick-tag">${escapeHtml(tag)}</span>${escapeHtml(q)}</button>`).join('');
      $('quickList').innerHTML = html;
      $('mobileQuick').innerHTML = items.map(([tag, q]) => `<button class="chip" data-fill="${escapeHtml(q)}">${escapeHtml(tag)}</button>`).join('');
    }
    renderQuick();
    document.querySelectorAll('.role-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); renderQuick(btn.dataset.role);
    }));

    // 간단히/자세히 답변 스타일 토글. 여기서 고른 값은 다음 질문(sendMessage/sendRoleFilter)
    // 전송 시 answer_style로 서버에 함께 보낸다.
    document.querySelectorAll('.style-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.answerStyle = btn.dataset.style;
    }));
    document.addEventListener('click', (e) => {
      const fill = e.target.closest('[data-fill]');
      if (fill) { input.value = fill.dataset.fill; autoResize(); input.focus(); }
    });

    function autoResize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px'; }
    input.addEventListener('input', autoResize);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    // ── 점수판(TAB) 이미지 업로드 ──
    // 업로드 버튼을 누르면 파일 선택창이 열리고, 이미지를 고르면 곧바로 서버로
    // 보내 TAB 점수판을 분석한 뒤 결과를 AI 메시지로 채팅창에 보여준다.
    const uploadBtn = $('uploadBtn');
    const screenshotInput = $('screenshotInput');
    const composerHintText = $('composerHintText');
    const composerHintDefault = composerHintText ? composerHintText.textContent : '';

    const UPLOAD_ICON = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
    const UPLOAD_SPINNER_ICON = '<svg viewBox="0 0 24 24" width="19" height="19" class="upload-spin"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 100"/></svg>';
    if (uploadBtn) uploadBtn.innerHTML = UPLOAD_ICON;

    function formatScoreboardResult(data) {
      // 인식 요약/표/불확실 항목/코치 피드백까지 전부 서버(vision_stats.py의
      // build_scoreboard_report)에서 마크다운으로 완성해서 내려준다 — 본인
      // 판별 우선순위나 표 형식이 바뀌어도 프론트를 따로 손볼 필요가 없다.
      if (data.report) return `📋 점수판 분석 결과\n\n${data.report}`;
      return '📋 점수판을 분석했지만 표시할 내용이 없습니다.';
    }

    async function uploadScoreboard(file) {
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = UPLOAD_SPINNER_ICON;
      uploadBtn.title = '이미지 분석 중...';
      if (composerHintText) composerHintText.textContent = '🖼 점수판 이미지를 분석하는 중입니다...';

      try {
        const formData = new FormData();
        formData.append('image', file, file.name || 'scoreboard.png');
        const res = await fetch('/chat/api/scoreboard/', {
          method: 'POST',
          headers: { 'X-CSRFToken': getCsrf() },
          body: formData,
        });
        const data = await parseJsonOrThrow(res);
        if (!res.ok || data.error) throw new Error(data.error || '이미지 분석에 실패했습니다.');
        addMessage('ai', formatScoreboardResult(data));
      } catch (err) {
        showError(err.message || '이미지 분석에 실패했습니다.');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = UPLOAD_ICON;
        uploadBtn.title = '점수판(TAB) 스크린샷 업로드';
        if (composerHintText) composerHintText.textContent = composerHintDefault;
        screenshotInput.value = '';
      }
    }

    uploadBtn?.addEventListener('click', () => screenshotInput?.click());
    screenshotInput?.addEventListener('change', () => {
      const file = screenshotInput.files?.[0];
      if (file) uploadScoreboard(file);
    });

    function addMessage(role, text, options = {}) {
      $('welcome')?.remove();
      // 저장된 대화를 불러와 다시 재생(replay)할 때(loadSavedChat)는 이미
      // 저장돼 있던 기록을 또 history에 쌓으면 안 되므로 skipHistory로 막는다.
      if (!options.skipHistory) {
        state.history.push({ role, text, options });
      }
      const row = document.createElement('div');
      row.className = `msg ${role}`;
      const avatar = document.createElement('div'); avatar.className = 'avatar';
      if (role === 'user') avatar.textContent = '나'; else avatar.innerHTML = AI_AVATAR_ICON;
      const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${role === 'user' ? '나' : '코치 AI'} · ${timeText()}`;
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      bubble.innerHTML = role === 'ai' ? simpleMarkdown(text) : `<p>${escapeHtml(text)}</p>`;
      if (role === 'user') {
        const badges = [];
        if (options.stats) badges.push('스탯 입력 감지');
        if (options.context) badges.push(options.context);
        if (badges.length) bubble.innerHTML += `<div class="badges">${badges.map(b => `<span class="badge">${escapeHtml(b)}</span>`).join('')}</div>`;
      }
      if (role === 'ai') {
        if (options.matchupCard) {
          const card = buildMatchupCard(options.matchupCard);
          if (card) bubble.appendChild(card);
        }
        if (options.recommendCard) {
          const card = buildRecommendCard(options.recommendCard);
          if (card) bubble.appendChild(card);
        }
        const buttons = buildResponseButtons(options);
        if (buttons) bubble.appendChild(buttons);
        if (options.turnId) bubble.appendChild(buildFeedbackUI(options.turnId));
      }
      wrap.appendChild(meta); wrap.appendChild(bubble);
      row.appendChild(avatar); row.appendChild(wrap);
      messages.appendChild(row); messages.scrollTop = messages.scrollHeight;
    }
    function buildMatchupCard(card) {
      const hardHeroes = card?.hard_heroes || [];
      const easyHeroes = card?.easy_heroes || [];
      if (!hardHeroes.length && !easyHeroes.length) return null;

      const wrap = document.createElement('div'); wrap.className = 'matchup-card';
      const title = document.createElement('div'); title.className = 'matchup-card-title';
      title.textContent = `${card.subject || ''} 상성 카드`;
      wrap.appendChild(title);

      const buildCol = (labelText, items, kind) => {
        if (!items.length) return null;
        const col = document.createElement('div'); col.className = `matchup-col matchup-col-${kind}`;
        const colTitle = document.createElement('div'); colTitle.className = 'matchup-col-title';
        colTitle.textContent = labelText;
        col.appendChild(colTitle);
        items.forEach(item => {
          const row = document.createElement('div'); row.className = 'matchup-item';
          const hero = document.createElement('span'); hero.className = 'matchup-hero'; hero.textContent = item.hero || '';
          const note = document.createElement('span'); note.className = 'matchup-note'; note.textContent = item.note || '';
          row.appendChild(hero); row.appendChild(note);
          col.appendChild(row);
        });
        return col;
      };

      const hardCol = buildCol('상대하기 어려운 영웅', hardHeroes, 'hard');
      const easyCol = buildCol('상대하기 쉬운 영웅', easyHeroes, 'easy');
      if (hardCol) wrap.appendChild(hardCol);
      if (easyCol) wrap.appendChild(easyCol);
      return wrap;
    }
    function buildRecommendCard(card) {
      const heroes = card?.heroes || [];
      if (!heroes.length) return null;

      const wrap = document.createElement('div'); wrap.className = 'matchup-card';
      const title = document.createElement('div'); title.className = 'matchup-card-title';
      title.textContent = card.mode === 'composition' ? '조합 추천 영웅 카드' : '교체 추천 영웅 카드';
      wrap.appendChild(title);

      const col = document.createElement('div'); col.className = 'matchup-col matchup-col-recommend';

        const note = document.createElement('span'); note.className = 'matchup-note'; note.textContent = item.note || '';
        row.appendChild(hero); row.appendChild(note);

    }
    function buildResponseButtons(options) {
      const box = document.createElement('div'); box.className = 'suggestions';
      let has = false;

        if (!item || !item.label) return;
        const btn = document.createElement('button'); btn.className = 'suggest-btn'; btn.textContent = item.label;
        btn.addEventListener('click', () => {
          if (item.type === 'role_filter') sendRoleFilter(item.value, item.label);
          else if (item.type === 'focus_hero') sendFocusHero(item.value, item.label);
          else { input.value = item.label; autoResize(); input.focus(); }
        });
        box.appendChild(btn); has = true;
      });
      (options.suggested || []).slice(0, 3).forEach(q => {
        const btn = document.createElement('button'); btn.className = 'suggest-btn'; btn.textContent = q;
        btn.addEventListener('click', () => { input.value = q; autoResize(); input.focus(); });
        box.appendChild(btn); has = true;
      });
      return has ? box : null;
    }
    function buildFeedbackUI(turnId) {
      const row = document.createElement('div'); row.className = 'feedback-row';
      const toggle = document.createElement('button');
      toggle.type = 'button'; toggle.className = 'feedback-toggle';
      toggle.textContent = '🙁 이 답변이 만족스럽지 않았나요?';

      const form = document.createElement('div'); form.className = 'feedback-form'; form.style.display = 'none';
      const textarea = document.createElement('textarea');
      textarea.placeholder = '어떤 점이 아쉬웠는지 알려주시면 개선에 도움이 됩니다.';
      const actions = document.createElement('div'); actions.className = 'feedback-actions';
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button'; cancelBtn.className = 'feedback-cancel'; cancelBtn.textContent = '취소';
      const submitBtn = document.createElement('button');
      submitBtn.type = 'button'; submitBtn.className = 'feedback-submit'; submitBtn.textContent = '제출';

      toggle.addEventListener('click', () => {
        const opening = form.style.display === 'none';
        form.style.display = opening ? 'flex' : 'none';
        if (opening) textarea.focus();
      });
      cancelBtn.addEventListener('click', () => { form.style.display = 'none'; textarea.value = ''; });
      submitBtn.addEventListener('click', async () => {
        const reason = textarea.value.trim();
        if (!reason) { textarea.focus(); return; }
        submitBtn.disabled = true; submitBtn.textContent = '전송 중...';
        try {
          const res = await fetch('/chat/api/feedback/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
            body: JSON.stringify({ turn_id: turnId, reason })
          });
          const data = await parseJsonOrThrow(res);
          if (!res.ok || data.error) throw new Error(data.error || '피드백 전송에 실패했습니다.');
          const done = document.createElement('div'); done.className = 'feedback-done';
          done.textContent = '피드백을 보내주셔서 감사합니다.';
          row.replaceChildren(done);

          submitBtn.disabled = false; submitBtn.textContent = '제출';
          alert(err.message || '피드백 전송에 실패했습니다.');
        }
      });

      actions.appendChild(cancelBtn); actions.appendChild(submitBtn);
      form.appendChild(textarea); form.appendChild(actions);
      row.appendChild(toggle); row.appendChild(form);

    }
    function addTyping() {
      const row = document.createElement('div'); row.className = 'msg ai'; row.id = 'typing';
      row.innerHTML = `<div class="avatar">${AI_AVATAR_ICON}</div><div class="bubble-wrap"><div class="meta">코치 AI</div><div class="bubble"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>답변을 준비하고 있습니다.</span></div></div></div>`;

    function removeTyping() { $('typing')?.remove(); }
    function showError(msg) {
      const div = document.createElement('div'); div.className = 'error'; div.textContent = msg;
      messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
    }
    function buildRequestBody(message, roleFilter, focusHero) {
      const body = { message: message || '', answer_style: state.answerStyle };
      if (roleFilter) body.role_filter = roleFilter;
      if (focusHero) body.focus_hero = focusHero;
      const extra = {};
      if (state.map && state.map.mode !== 'none') extra.map_name = state.map.name;
      if (state.side) extra.side = state.side;
      if (Object.keys(extra).length) body.extra_context = extra;
      return body;
    }
    async function requestChat(body) {
      const res = await fetch('/chat/api/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
        body: JSON.stringify(body)
      });
      const data = await parseJsonOrThrow(res);
      if (!res.ok || data.error) throw new Error(data.error || '응답 중 오류가 발생했습니다.');
      return data;
    }
    async function sendMessage() {
      const text = input.value.trim(); if (!text || state.busy) return;
      const ctx = contextLabel();
      addMessage('user', text, { stats: hasStats(text), context: ctx });
      input.value = ''; autoResize();
      state.q++; $('questionCount').textContent = state.q;
      state.busy = true; sendBtn.disabled = true; addTyping();
      try {
        const data = await requestChat(buildRequestBody(text));
        removeTyping();
        addMessage('ai', data.answer || '답변이 비어 있습니다.', { suggested: data.suggested_questions || [], choiceButtons: data.choice_buttons || [], turnId: data.turn_id, matchupCard: data.matchup_card, recommendCard: data.recommend_card });
      } catch (err) {
        removeTyping(); showError(err.message || '연결에 실패했습니다.');
      } finally {
        state.busy = false; sendBtn.disabled = false; input.focus();
